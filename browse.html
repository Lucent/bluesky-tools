<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread Browser</title>
<style>
	:root {
		color-scheme: light dark;
		--line: color-mix(in srgb, CanvasText 22%, transparent);
		--faint: color-mix(in srgb, CanvasText 7%, transparent);
		--edge: color-mix(in srgb, CanvasText 42%, transparent);
		--quote: #c79a4a;
		--tweet: #5b9bd5;
		--ext: #4aa564;
		--kin: #b07cff;   /* sidebar same-tree highlight; saturated so it shows in light & dark */
		--hit: #f5c518;   /* search match highlight */
	}
	html, body { height: 100%; margin: 0; }
	body {
		font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		color: CanvasText; background: Canvas;
		display: flex; flex-direction: column;
	}
	header {
		display: flex; gap: 0.5em 0.8em; align-items: center; flex-wrap: wrap;
		padding: 0.4em 0.8em; border-bottom: 1px solid var(--line); background: Canvas;
		flex: 0 0 auto;
	}
	header input { width: 12em; padding: 0.3em 0.5em; font: inherit; }
	header button { padding: 0.3em 0.8em; font: inherit; cursor: pointer; }
	#avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
	#account { display: flex; flex-direction: column; line-height: 1.2; margin-right: auto; font-style: normal; }
	#acctName { font-weight: 600; color: CanvasText; }
	#acctName a { color: LinkText; text-decoration: none; font-weight: 500; }
	#acctName a:hover { text-decoration: underline; }
	#listToggle { cursor: pointer; font-size: 1.2em; line-height: 1; user-select: none; color: GrayText; }
	/* The list is shown/hidden purely by the checkbox state — no JS. */
	#hidelist:checked ~ main { grid-template-columns: 1fr; }
	#hidelist:checked ~ main #sidebar { display: none; }
	#acctDesc { color: GrayText; }
	#help { color: GrayText; font-size: 0.78em; }
	#status { color: GrayText; font-size: 0.85em; }

	main { flex: 1 1 auto; display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
	aside {
		font-size: 0.85em; overflow-y: auto;
		padding: 0.5em; border-right: 1px solid var(--line); background: Canvas;
	}
	aside h3 { margin: 0.2em 0 0.5em; font-size: 0.8em; color: GrayText; text-transform: uppercase; letter-spacing: 0.05em; }
	aside ul { list-style: none; margin: 0; padding: 0; position: relative; }
	aside li { padding: 0.4em 0.3em; cursor: pointer; border-bottom: 1px solid var(--faint); color: CanvasText; }
	aside li:hover { background: var(--faint); }
	/* Rows in the same tree as the hovered row: a saturated translucent overlay
	   (mixed with transparent, not Canvas, so it shows in dark mode too) plus a
	   bold bar down the side. */
	aside li.kin { background: color-mix(in srgb, var(--kin) 20%, transparent); box-shadow: inset 3px 0 0 var(--kin); }
	aside li.active { background: color-mix(in srgb, AccentColor 30%, Canvas); }
	/* Box drawn over the run of those rows, reinforcing them as one group. */
	#kinbox { position: absolute; left: 0; right: 0; display: none; pointer-events: none;
		border: 2px solid var(--kin); border-radius: 5px;
		background: color-mix(in srgb, var(--kin) 14%, transparent); }
	aside li small { display: block; color: GrayText; }

	#view { position: relative; min-width: 0; min-height: 0; }
	#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; background:
		repeating-linear-gradient(0deg,var(--faint) 0 1px,transparent 1px 26px),
		repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px 26px), Canvas; }
	#graph.grabbing { cursor: grabbing; }

	.node rect { fill: Canvas; stroke: var(--line); stroke-width: 1.2; rx: 6; }
	.node:hover rect { stroke: AccentColor; }
	/* ring the nodes matching the active search */
	.node.hit rect { stroke: var(--hit); stroke-width: 2.5; fill: color-mix(in srgb, var(--hit) 18%, Canvas); }
	.node.focus rect { fill: color-mix(in srgb, AccentColor 16%, Canvas); stroke: AccentColor; stroke-width: 2; }
	.node.root rect { stroke-width: 3.5; }   /* a pinned thread root — ⌘-click to remove it */
	.node.quote rect { fill: var(--faint); stroke-dasharray: 4 3; }
	.node.tweet rect { fill: color-mix(in srgb, var(--tweet) 14%, Canvas); stroke: var(--tweet); }   /* light Twitter blue */
	.node.external rect { fill: color-mix(in srgb, var(--ext) 13%, Canvas); stroke: var(--ext); }     /* outside post we replied to, fetched on demand */
	.node .date { fill: GrayText; font-size: 10px; }
	.node a:hover .date.link { fill: LinkText; text-decoration: underline; }
	.node .body { fill: CanvasText; font-size: 12px; }
	.node .badge { fill: GrayText; font-size: 10px; }
	.node .lnk { fill: LinkText; text-decoration: underline; }
	.node .men, .node .tag { fill: LinkText; }
	.node text.foot { font-size: 10.5px; }
	.node .clink { fill: LinkText; }   /* link-card chips are real <a>, so the browser gives the pointer */
	.node .cmedia { fill: GrayText; }
	.node .dbl { fill: none; stroke: var(--quote); stroke-width: 1; }
	/* cursor is inherited, so stop the canvas's grab at the node boundary and let
	   the browser pick per element inside (pointer on the date <a>, text over
	   text, default on the box). In-tree nodes only re-centre, so they stay default. */
	.node { cursor: auto; }
	/* …but an off-tree quote/reply satellite, whose click loads that post's own
	   graph, gets a pointer (excluding X satellites, whose only link is the footer). */
	.node.quote:not(.tweet) { cursor: pointer; }

	.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
	.edge.quoteedge { stroke: var(--quote); stroke-dasharray: 5 4; marker-end: url(#qarrow); }
	.edge.graft { stroke: var(--quote); }
	.edge.extedge { stroke: var(--ext); stroke-dasharray: 5 4; }

	#legend {
		position: absolute; left: 10px; bottom: 10px;
		background: color-mix(in srgb, Canvas 88%, transparent); border: 1px solid var(--line); border-radius: 5px;
		padding: 0.3em 0.6em; font-size: 0.78em; color: GrayText;
	}
	#legend svg { vertical-align: middle; }
	#legend .reply { stroke: var(--edge); }
	#legend .quote { stroke: var(--quote); }
	#legend .ext { stroke: var(--ext); }
	.hint { position: absolute; inset: 0; display: grid; place-items: center; color: GrayText; padding: 2em; text-align: center; }
</style>
</head>
<body>
<input type="checkbox" id="hidelist" hidden>
<header>
	<label for="hidelist" id="listToggle" title="Show/hide the list">☰</label>
	<img id="avatar" alt="" hidden>
	<address id="account">
		<span id="acctName"></span>
		<small id="acctDesc"></small>
	</address>
	<span id="help">⌘/ctrl-click a quote to merge its thread; a bold root to remove it</span>
	<button id="fit">Fit</button>
	<input id="q" type="search" placeholder="search posts…">
	<span id="status"></span>
</header>
<main>
	<aside id="sidebar"></aside>
	<section id="view">
		<svg id="graph">
			<defs>
				<marker id="qarrow" viewBox="0 0 10 10" refX="9" refY="5"
								markerWidth="8" markerHeight="8" orient="auto">
					<!-- context-stroke: arrowhead inherits each edge's own stroke colour -->
					<path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
				</marker>
			</defs>
			<g id="scene"></g>
		</svg>
		<div id="legend">
			<svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="reply" stroke-width="1.4"/></svg> reply&nbsp;&nbsp;
			<svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="quote" stroke-width="1.4" stroke-dasharray="5 4"/></svg> quote&nbsp;&nbsp;
			<svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="ext" stroke-width="1.4" stroke-dasharray="5 4"/></svg> external reply
		</div>
		<p class="hint" id="hint">Loading…</p>
	</section>
</main>

<script type="module">
// ES module: strict by default, module-scoped (no globals leak), and deferred —
// so the DOM is already parsed when this runs.
const SVGNS = "http://www.w3.org/2000/svg";
// index entries are compact: { t:text, d:createdAt, p:parentRkey?, q:[quoted]?,
//   f:facets?, alt:[strings]?, ext:{u,t,d}?, img:n?, vid:true?, xp:parentDid? }
// xp/xr/xrd are set when a reply targets someone else's post (the parent isn't
// in the archive): xp = parent DID, xr = thread root rkey, xrd = root DID. The
// browser groups our posts by xr and fetches the connecting outside posts from
// the public API on demand (see injectGroup); each fetched post is added as
// a real entry keyed by its own rkey with { external:true, did, handle, t, d, f?,
// p? } so it slots straight into the reply tree.
// Quoted tweets are real entries keyed "x:<rkey>" with { tweet:true, u, t, a }.
let INDEX = {};
let DID = "";          // repo DID, for building bsky.app permalinks
let META = {};         // account profile: {name, desc, avatar?}
let PINS = [];         // pinned thread roots shown together (ctrl+click merges threads)
// Cache of the last full render so a click within the same pinned set can just
// move the highlight + pan, instead of re-laying-out and re-fitting the view.
let lastPinsKey = null, lastPos = null, lastH = null, lastBounds = null;
let lastShown = null;  // hash we last restored, to dedupe popstate/hashchange/our own writes
const children = {};   // rkey -> [child rkeys]   (local replies)
const quotedBy = {};   // rkey -> [quoting rkeys] (local quotes pointing in)

// Our posts that reply into outside threads, grouped by the thread root rkey
// (entry.xr). Lets us put every post we made in one outside thread on a single
// graph. Built in buildGraph(); state per root tracks the on-demand fetch.
const EXTGROUPS = {};   // rootRkey -> [our post rkeys sharing that root]
const EXTSTATE = {};    // rootRkey -> undefined | "loading" | "done"
const APPVIEW = "https://public.api.bsky.app/xrpc";

let FOCUS = null;

// Layout constants. Boxes are fixed width but grow in height to fit their text
// (posts cap near 300 chars), so short posts stay compact and long ones aren't
// clipped. Per-node heights live in the HMAP built each navigate().
const NODE_W = 240, H_GAP = 26, V_GAP = 46, SAT_GAP = 34, SAT_VGAP = 14, FOREST_GAP = 90;
const PAD = 11, DATE_Y = 16, BODY_TOP = 33, LINE_H = 16;
const MAX_CHARS = 35, MAX_LINES = 11;

const $ = (s) => document.querySelector(s);
const setStatus = (m) => { $("#status").textContent = m; };
const svg = $("#graph");
const scene = $("#scene");

// ---- view transform (pan / zoom) ----
let tx = 0, ty = 0, scale = 1;
function applyTransform() {
	scene.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}

// ---------- data loading ----------
async function load(src = "index.json") {
	setStatus("Loading " + src + "…");
	const r = await fetch(src);
	if (!r.ok) throw new Error("HTTP " + r.status + " loading " + src);
	const data = await r.json();
	INDEX = data.posts;                    // {did, meta, posts} payload
	DID = data.did;
	META = data.meta;
	populateHeader();
	buildGraph();
	buildSidebar();
	const dates = Object.values(INDEX).map(e => e.d).filter(Boolean);
	const latest = dates.length ? dates.reduce((a, b) => a > b ? a : b).slice(0, 10) : "";
	$("#status").innerHTML = `${Object.keys(INDEX).length} posts loaded.`
		+ (latest ? `<br>Up to ${latest}` : "");
	FOCUS = null; PINS = []; lastPinsKey = null;   // force the first navigate to fully render (and replace, not push)
	showHash(true);                                // restore a shared/bookmarked (possibly merged) view, fetching outside threads it names
}

function buildGraph() {
	for (const rkey in INDEX) { children[rkey] = []; quotedBy[rkey] = []; }
	for (const rkey in INDEX) {
		const e = INDEX[rkey];
		if (e.p && INDEX[e.p]) children[e.p].push(rkey);
		for (const q of e.q || []) if (INDEX[q]) quotedBy[q].push(rkey);
	}
	const byDate = (a, b) => (INDEX[a].d || "").localeCompare(INDEX[b].d || "");
	for (const k in children) children[k].sort(byDate);
	for (const k in quotedBy) quotedBy[k].sort(byDate);
	for (const rkey in INDEX) {                         // group our posts by outside thread root
		const r = INDEX[rkey].xr;
		if (r) (EXTGROUPS[r] || (EXTGROUPS[r] = [])).push(rkey);
	}
}

function localRoot(rkey) {
	const seen = new Set([rkey]);
	let cur = rkey;
	while (true) {
		const par = INDEX[cur] && INDEX[cur].p;
		if (!par || !INDEX[par] || seen.has(par)) return cur;
		seen.add(par);
		cur = par;
	}
}

function isLocalRoot(rkey) {
	const e = INDEX[rkey];
	return !e.p || !INDEX[e.p];
}

// The root of the graph a click on this post would open: its local thread root,
// or — when that root is a reply into an outside thread — that outside root (xr).
// Posts that land on the same assembled graph share this key.
function graphRoot(rkey) {
	const r = localRoot(rkey);
	return INDEX[r].xr || r;
}

// An empty reply to someone else's post is noise — skip it. The exception is
// the trick of replying to an outside post with only a quote of one of our own
// posts, which we keep because it connects that post into our own tree.
function isNoise(rkey) {
	const e = INDEX[rkey];
	if ((e.t || "").trim()) return false;          // has its own words
	if (!e.p || INDEX[e.p]) return false;           // not a reply to someone else
	return !(e.q || []).some(q => INDEX[q]);        // keep only if it quotes our own post
}

// A textless leaf reply to one of our own posts whose only payload is a quote
// is just a connector — we collapse the empty box and hang its quote straight
// off the parent (drawn with a double border to flag the shortcut).
function isCollapsible(rkey) {
	const e = INDEX[rkey];
	if ((e.t || "").trim()) return false;           // has its own words
	if (!e.p || !INDEX[e.p]) return false;          // must reply to one of our posts
	if (e.img || e.vid || e.ext) return false;      // carries other content
	if (children[rkey].length) return false;        // has replies — would orphan them
	return e.q && e.q.some(q => INDEX[q]);
}

function descendantCount(rkey, seen) {
	seen = seen || new Set();
	if (seen.has(rkey)) return 0;
	seen.add(rkey);
	let n = 0;
	for (const c of children[rkey]) n += 1 + descendantCount(c, seen);
	return n;
}

function topThreads() {
	const score = (r) => descendantCount(r) + quotedBy[r].length;
	return Object.keys(INDEX)
		.filter(r => isLocalRoot(r) && !isNoise(r) && !INDEX[r].tweet && !INDEX[r].external)
		.map(r => ({rkey: r, s: score(r), d: INDEX[r].d || ""}))
		.filter(x => x.s > 0)
		.sort((a, b) => (b.s - a.s) || b.d.localeCompare(a.d));
}

// A sidebar row: a <li> with the date in <small>, then the snippet text.
// Clicking centers `goto`; `mark` (lowercased query) highlights the match.
function sidebarItem(rk, goto, metaText, mark) {
	const li = document.createElement("li");
	// The graph this row opens (see graphRoot): drives clustering, the hover box,
	// and the active highlight, so a row lights up whenever its graph is pinned.
	const g = graphRoot(rk);
	li.dataset.group = g;
	if (PINS.includes(g)) li.className = "active";
	li.onclick = () => navigate(goto);
	const meta = document.createElement("small");
	meta.textContent = metaText;
	li.append(meta);
	const t = INDEX[rk].t || "(no text)";
	const i = mark ? t.toLowerCase().indexOf(mark) : -1;
	if (i < 0) {
		li.append(t.slice(0, 110));
	} else {                                    // show the match in context, highlighted
		const start = Math.max(0, i - 28);
		li.append(start ? "…" + t.slice(start, i) : t.slice(0, i));
		const m = document.createElement("mark");
		m.textContent = t.slice(i, i + mark.length);
		li.append(m);
		const end = i + mark.length + 80;
		li.append(t.slice(i + mark.length, end) + (end < t.length ? "…" : ""));
	}
	return li;
}

// Fill the header with the account: avatar, display name (linked to bsky.app),
// and the profile description.
function populateHeader() {
	const m = META;
	// Display name links to the profile via DID (handles aren't recorded in the
	// archive, but bsky.app/profile/<did> resolves fine).
	const lk = document.createElement("a");
	lk.href = `https://bsky.app/profile/${DID}`;
	lk.textContent = m.name;
	$("#acctName").append(lk);
	$("#acctDesc").textContent = m.desc;
	const av = $("#avatar");
	if (m.avatar) {                        // optional — the <img> starts hidden
		av.src = `https://cdn.bsky.app/img/avatar_thumbnail/plain/${DID}/${m.avatar}@jpeg`;
		av.hidden = false;
	}
	document.title = m.name + " — Thread Browser";
}

function heading(text) {
	const h = document.createElement("h3");
	h.textContent = text;
	return h;
}

function buildSidebar() {
	const sb = $("#sidebar");
	sb.innerHTML = "";
	kinGroup = null;                            // the boxed group is gone with the old rows
	const q = $("#q").value.trim().toLowerCase();
	const ul = document.createElement("ul");
	const kinbox = document.createElement("div");   // hover box drawn over a same-tree run
	kinbox.id = "kinbox";
	ul.append(kinbox);                          // positioned, so it paints over the rows

	if (q) {                                    // search: list the matching posts themselves
		const hits = [];
		for (const rk in INDEX)
			if (!INDEX[rk].tweet && !INDEX[rk].external && searchText(INDEX[rk]).includes(q)) hits.push(rk);
		// Cluster by the graph each hit belongs to (so same-tree results are
		// adjacent and boxable), ordering trees by their most recent hit and rows
		// within a tree newest-first.
		const newest = {};
		for (const rk of hits) {
			const g = graphRoot(rk), d = INDEX[rk].d || "";
			if (!newest[g] || d > newest[g]) newest[g] = d;
		}
		hits.sort((a, b) => {
			const ga = graphRoot(a), gb = graphRoot(b);
			if (ga !== gb) return newest[gb].localeCompare(newest[ga]) || (ga < gb ? -1 : 1);
			return (INDEX[b].d || "").localeCompare(INDEX[a].d || "");
		});
		sb.append(heading(`${hits.length} post${hits.length === 1 ? "" : "s"} match “${q}”`), ul);
		for (const rk of hits.slice(0, 300))
			ul.append(sidebarItem(rk, rk, (INDEX[rk].d || "").slice(0, 10), q));
		return;
	}

	const ranked = topThreads();
	sb.append(heading(`Top threads (${ranked.length})`), ul);
	for (const {rkey, s} of ranked.slice(0, 250))
		ul.append(sidebarItem(rkey, rkey, (INDEX[rkey].d || "").slice(0, 10) + ` · ${s} ↳`, null));
}

// ---------- text helpers ----------
// Split text into styled runs using the byte-offset facets (links/mentions/tags).
function richSegments(e) {
	const txt = e.t || "";
	if (!txt.trim()) {
		let t = "(no text)";
		if (e.ext && e.ext.t) t = e.ext.t;
		else if (e.img) t = "";          // the thumbnail (+ its alt caption) carries it
		else if (e.vid) t = "[video]";
		return [{t}];
	}
	if (!e.f || !e.f.length) return [{t: txt}];
	const enc = new TextEncoder(), dec = new TextDecoder();
	const bytes = enc.encode(txt);
	const facets = [...e.f].sort((a, b) => a.index.byteStart - b.index.byteStart);
	const segs = [];
	let cursor = 0;
	for (const f of facets) {
		const start = f.index.byteStart, end = f.index.byteEnd;
		if (start < cursor) continue;
		if (start > cursor) segs.push({t: dec.decode(bytes.slice(cursor, start))});
		const inner = dec.decode(bytes.slice(start, end));
		const feat = f.features[0];
		if (feat.$type === "app.bsky.richtext.facet#link") segs.push({t: inner, link: feat.uri});
		else if (feat.$type === "app.bsky.richtext.facet#mention") segs.push({t: inner, men: true});
		else if (feat.$type === "app.bsky.richtext.facet#tag") segs.push({t: inner, tag: true});
		else segs.push({t: inner});
		cursor = end;
	}
	if (cursor < bytes.length) segs.push({t: dec.decode(bytes.slice(cursor))});
	return segs;
}

// Greedy word-wrap that preserves each run's style; returns lines of runs.
function wrapSegs(segs) {
	const lines = [];
	let cur = [], curLen = 0, truncated = false;
	const pushLine = () => { lines.push(cur); cur = []; curLen = 0; };
	const add = (text, seg) => { cur.push({text, link: seg.link, men: seg.men, tag: seg.tag}); curLen += text.length; };

	outer:
	for (const seg of segs) {
		for (let part of seg.t.split(/(\s+)/)) {
			if (part === "") continue;
			if (/^\s+$/.test(part)) {                       // whitespace
				if (part.includes("\n")) { if (cur.length) pushLine(); }   // newline → hard break
				else if (curLen > 0) add(" ", seg);                        // soft space (not at line start)
				continue;
			}
			while (part.length > MAX_CHARS) {               // hard-break very long token
				if (curLen > 0) pushLine();
				if (lines.length >= MAX_LINES) { truncated = true; break outer; }
				add(part.slice(0, MAX_CHARS - 1) + "·", seg);
				pushLine();
				part = part.slice(MAX_CHARS - 1);
			}
			if (curLen > 0 && curLen + part.length > MAX_CHARS) {
				pushLine();
				if (lines.length >= MAX_LINES) { truncated = true; break outer; }
			}
			add(part, seg);
		}
	}
	if (cur.length) pushLine();
	if (lines.length > MAX_LINES) { lines.length = MAX_LINES; truncated = true; }
	if (truncated && lines.length) {
		const last = lines[lines.length - 1];
		if (last.length) { const r = last[last.length - 1]; r.text = r.text.replace(/.$/, "") + "…"; }
		else last.push({text: "…"});
	}
	return lines;
}

function domain(u) {
	return new URL(u).hostname.replace(/^www\./, "");
}

// Everything a search should match for a post, lowercased: its text, image alt
// text, and any link URLs (richtext facets + external card).
function searchText(e) {
	let s = e.t || "";
	if (e.img) for (const im of e.img) if (im.a) s += " " + im.a;
	if (e.ext && e.ext.u) s += " " + e.ext.u;
	if (e.f) for (const f of e.f) for (const feat of f.features) if (feat.uri) s += " " + feat.uri;
	return s.toLowerCase();
}

// Dumbnail: the full-size CDN image (built from the blob CID + repo DID) dropped
// into a fixed box and shrunk by the browser — no thumbnailing, no aspect math.
const CDN_IMG = "https://cdn.bsky.app/img/feed_fullsize/plain/";
const imgURL = (cid) => `${CDN_IMG}${DID}/${cid}@jpeg`;

// Footer chips for attachments with no inline representation. Inline facet
// links aren't listed here — they're shown in the text (hover for the URL), so
// a footer chip would just be noise. External cards / video / tweets aren't in
// the text, so they get a chip.
function mediaChips(e) {
	const c = [];
	if (e.ext && e.ext.u) {
		const title = (e.ext.t || "").trim();
		const label = title ? (title.length > 46 ? title.slice(0, 45) + "…" : title) : domain(e.ext.u);
		const tip = [title, e.ext.d, domain(e.ext.u)].filter(Boolean).join("\n");
		c.push({label: "▤ " + label, url: e.ext.u, cls: "clink", title: tip});
	}
	if (e.vid) c.push({label: "▶ video", cls: "cmedia"});
	if (e.tweet && e.u) c.push({label: "↗ " + domain(e.u), url: e.u, cls: "clink"});
	return c;                              // images are drawn as a frame, not a chip
}

// Build wrapped lines, image thumbnails, chips, and pixel height (cached per view).
function nodeLayout(rk) {
	const e = INDEX[rk];
	const lines = wrapSegs(richSegments(e));
	const chips = mediaChips(e);
	let img = null;
	if (e.img && e.img.length) {                  // dumbnails: each image shrunk into a fixed box, stacked
		const W = NODE_W - 2 * PAD, TH = 120, GAP = 4;
		const boxes = e.img.map((im, i) => ({x: PAD, y: i * (TH + GAP), w: W, h: TH, c: im.c, alt: im.a || ""}));
		img = {boxes, h: e.img.length * (TH + GAP) - GAP};
	}
	let h = BODY_TOP + (lines.length - 1) * LINE_H + 6;
	if (img) h += 6 + img.h;
	if (chips.length) h += 8 + 13;
	h += 9;
	return {lines, chips, img, h};
}

// ---------- visible subgraph ----------
// Build the union of every pinned thread. Quotes between two visible posts
// become connecting edges; quotes to anything outside stay as satellites.
function buildVisible(pins) {
	const pinSet = new Set(pins);
	const tree = new Set();
	for (const root of pins) (function walk(rk) {
		if (tree.has(rk)) return;
		tree.add(rk);
		for (const c of children[rk]) walk(c);
	})(root);

	// Collapse blank quote-only leaf replies to our own posts: drop the empty box
	// and graft the quoted post into its slot AS A REPLY (it really is one) — a
	// child via a solid edge, drawn with a double border to flag the shortcut.
	const collapsed = [];
	for (const rk of tree) if (!pinSet.has(rk) && isCollapsible(rk)) collapsed.push(rk);
	for (const rk of collapsed) tree.delete(rk);

	const grafts = new Set();                       // grafted nodes — drawn double-boxed
	const treeKids = {};                            // per-view child lists (replies + grafts)
	for (const rk of tree) treeKids[rk] = children[rk].filter(c => tree.has(c));

	const quoteEdges = [];   // {from, to}  meaning "from quotes to"
	// An off-tree quote post is one box (satNodeMap) but every link to it gets its
	// own edge (satEdges) — so a post quoted by several visible posts shows once
	// with several arrows pointing in.
	const satNodeMap = {};   // rkey -> {rkey, anchor, dir}  (placement + badge)
	const satEdges = [];     // {anchor, sat, dir}           (one per quote link)
	const addSat = (q, anchor, dir) => {
		if (!satNodeMap[q]) satNodeMap[q] = {rkey: q, anchor, dir};   // place beside its first linker
		satEdges.push({anchor, sat: q, dir});
	};

	for (const c of collapsed) {
		const anchor = INDEX[c].p;                     // a collapsed leaf's parent is never collapsed
		if (!tree.has(anchor)) continue;
		for (const q of INDEX[c].q || []) {
			if (!INDEX[q]) continue;
			if (tree.has(q)) quoteEdges.push({from: anchor, to: q});   // target already shown → just link
			else { tree.add(q); treeKids[q] = []; treeKids[anchor].push(q); grafts.add(q); }
		}
	}

	// Quote edges + satellites for the real (non-grafted) tree.
	for (const n of tree) {
		if (grafts.has(n)) continue;                   // grafted leaves carry no further links here
		for (const q of INDEX[n].q || []) {
			if (!INDEX[q]) continue;
			if (tree.has(q)) quoteEdges.push({from: n, to: q});
			else if (!isNoise(q)) addSat(q, n, "out");
		}
		for (const q of quotedBy[n]) {       // in-tree quotes are caught from the other side
			if (!tree.has(q)) addSat(q, n, "in");
		}
	}
	return {tree, quoteEdges, satNodes: Object.values(satNodeMap), satEdges, treeKids, grafts};
}

// Contour-based tidy tree (Reingold–Tilford style): each subtree is packed as
// close to its left sibling as its actual silhouette allows, per depth — so a
// shallow branch sits right next to a deep/wide neighbour instead of being
// shoved aside by raw leaf counts. Only x/depth are set here; y comes from rows.
//
// `res` (optional) reserves a quote gutter beside chosen anchors: res.span[rk]
// = how many rows the anchor's quote stack spans, res.side[rk] = "L"|"R". The
// gutter is baked into the node's contour so the tree relaxes to clear it, and
// res.gutterOffset[rk] (x of the gutter relative to the node) is filled in for
// placement. Pass res=null for a plain pass.
function layoutTree(root, tree, treeKids, res) {
	const pos = {};
	const SEP = NODE_W + H_GAP;
	const kidsOf = (rk) => treeKids[rk] || [];
	const shift = (rk, dx) => { pos[rk].x += dx; for (const c of kidsOf(rk)) shift(c, dx); };

	// Widen one side's contour to fit the anchor's quote gutter over its row span.
	function reserve(rk, cx, left, right) {
		const k = res.span[rk];
		if (res.side[rk] === "R") {
			let edge = -Infinity;
			for (let i = 0; i <= Math.min(k, right.length - 1); i++) edge = Math.max(edge, right[i] + NODE_W);
			const satLeft = edge + SAT_GAP;
			res.gutterOffset[rk] = satLeft - cx;
			for (let i = 0; i <= k; i++) {
				if (i < right.length) right[i] = Math.max(right[i], satLeft);
				else { right.push(satLeft); left.push(satLeft); }
			}
		} else {
			let edge = Infinity;
			for (let i = 0; i <= Math.min(k, left.length - 1); i++) edge = Math.min(edge, left[i]);
			const satLeft = edge - SAT_GAP - NODE_W;
			res.gutterOffset[rk] = satLeft - cx;
			for (let i = 0; i <= k; i++) {
				if (i < left.length) left[i] = Math.min(left[i], satLeft);
				else { left.push(satLeft); right.push(satLeft); }
			}
		}
	}

	// returns left/right contours (x per relative depth, 0 = this node)
	function build(rk, depth) {
		const kids = kidsOf(rk);
		let cx, left, right;
		if (!kids.length) {
			cx = 0; left = [0]; right = [0];
		} else {
			const childC = [];
			let acc = null;                            // running right contour of placed siblings
			for (let i = 0; i < kids.length; i++) {
				const c = build(kids[i], depth + 1);
				if (i === 0) { childC.push(c); acc = c.right.slice(); continue; }
				let s = 0;                               // shift needed so this child clears its left siblings
				const common = Math.min(acc.length, c.left.length);
				for (let d = 0; d < common; d++) s = Math.max(s, acc[d] + SEP - c.left[d]);
				shift(kids[i], s);
				const cl = c.left.map(v => v + s), cr = c.right.map(v => v + s);
				childC.push({left: cl, right: cr});
				for (let d = 0; d < cr.length; d++) { if (d < acc.length) acc[d] = cr[d]; else acc.push(cr[d]); }
			}
			cx = (pos[kids[0]].x + pos[kids[kids.length - 1]].x) / 2;
			left = [cx]; right = [cx];
			let maxLen = 0;
			for (const c of childC) maxLen = Math.max(maxLen, c.left.length);
			for (let d = 0; d < maxLen; d++) {
				let lo = Infinity, hi = -Infinity;
				for (const c of childC) {
					if (d < c.left.length) lo = Math.min(lo, c.left[d]);
					if (d < c.right.length) hi = Math.max(hi, c.right[d]);
				}
				left.push(lo); right.push(hi);
			}
		}
		pos[rk] = {x: cx, depth};
		if (res && res.span[rk] != null) reserve(rk, cx, left, right);
		return {left, right};
	}

	build(root, 0);
	return pos;                                    // raw coords; layoutForest places & offsets
}

// Lay each pinned thread out independently and stack them left-to-right (gutters
// included in each tree's extent), so a merged view shows the threads as
// adjacent trees joined by their quote edges.
function layoutForest(pins, tree, treeKids, res) {
	const pos = {};
	let cursor = 0;
	for (const root of pins) {
		const sub = layoutTree(root, tree, treeKids, res);
		let lo = Infinity, hi = -Infinity;
		for (const k in sub) { lo = Math.min(lo, sub[k].x); hi = Math.max(hi, sub[k].x + NODE_W); }
		if (res) for (const k in sub) {              // include reserved quote gutters in the extent
			const off = res.gutterOffset[k];
			if (off == null) continue;
			lo = Math.min(lo, sub[k].x + off); hi = Math.max(hi, sub[k].x + off + NODE_W);
		}
		const dx = cursor - lo;
		for (const k in sub) pos[k] = {x: sub[k].x + dx, depth: sub[k].depth};
		cursor = hi + dx + FOREST_GAP;
	}
	return pos;
}

// ---------- SVG drawing ----------
function el(tag, attrs, parent) {
	const n = document.createElementNS(SVGNS, tag);
	for (const k in attrs) n.setAttribute(k, attrs[k]);
	if (parent) parent.appendChild(n);
	return n;
}

function drawEdge(parent, x1, y1, x2, y2, cls) {
	// vertical-ish cubic bezier for reply edges; gentle curve for quotes
	const dy = (y2 - y1);
	const c = Math.max(20, Math.abs(dy) * 0.4);
	const d = `M ${x1} ${y1} C ${x1} ${y1 + c}, ${x2} ${y2 - c}, ${x2} ${y2}`;
	el("path", {d, class: cls}, parent);
}

function drawNode(parent, rkey, x, y, lay, cls, badge, dbl) {
	const e = INDEX[rkey];
	const klass = "node " + (cls || "") + (e.tweet ? " tweet" : "") + (e.external ? " external" : "");
	const g = el("g", {class: klass, "data-rkey": rkey, transform: `translate(${x},${y})`}, parent);
	el("rect", {width: NODE_W, height: lay.h, rx: 6}, g);
	if (dbl) el("rect", {x: 3, y: 3, width: NODE_W - 6, height: lay.h - 6, rx: 4, class: "dbl"}, g);

	// date — links to the real bsky.app post (skip tweet nodes, which have no date).
	// External parents live on another repo, so use their own DID + rkey.
	const linkDid = e.external ? e.did : DID;
	const linkRkey = e.external ? e.rkey : rkey;
	// date on the right; badge (quoted / 𝕏 username / @handle) on the left
	const dstr = (e.d || "").slice(0, 10);
	if (dstr && !e.tweet) {
		const a = el("a", {href: `https://bsky.app/profile/${linkDid}/post/${linkRkey}`}, g);
		const date = el("text", {x: NODE_W - PAD, y: DATE_Y, class: "date link", "text-anchor": "end"}, a);
		date.textContent = dstr;
		const t = el("title", {}, a); t.textContent = "Open on Bluesky";
		a.addEventListener("click", (ev) => ev.stopPropagation());   // don't also recenter
	} else if (dstr) {
		const date = el("text", {x: NODE_W - PAD, y: DATE_Y, class: "date", "text-anchor": "end"}, g);
		date.textContent = dstr;
	}
	if (badge) {
		const b = el("text", {x: PAD, y: DATE_Y, class: "badge"}, g);
		b.textContent = badge;
	}

	// body — one <text> per wrapped line, with styled (and clickable) runs
	lay.lines.forEach((runs, i) => {
		const line = el("text", {x: PAD, y: BODY_TOP + i * LINE_H, class: "body"}, g);
		for (const r of runs) {
			if (r.link) {                              // real link: same-tab click, native ⌘/ctrl-click
				const a = el("a", {href: r.link}, line);
				a.addEventListener("click", (ev) => ev.stopPropagation());   // don't also recenter the node
				const ts = el("tspan", {class: "lnk"}, a);
				ts.textContent = r.text;
				const t = el("title", {}, a); t.textContent = r.link;   // hover shows the URL
			} else {
				const klass = r.men ? "men" : r.tag ? "tag" : null;
				const ts = el("tspan", klass ? {class: klass} : {}, line);
				ts.textContent = r.text;
			}
		}
	});

	let yb = BODY_TOP + (lay.lines.length - 1) * LINE_H + 6;   // bottom of the text block

	// dumbnails: just <image src=url>, shrunk into the box, alt as a hover title
	if (lay.img) {
		const fy = yb + 6;
		for (const b of lay.img.boxes) {
			const im = el("image", {x: b.x, y: fy + b.y, width: b.w, height: b.h, href: imgURL(b.c)}, g);
			if (b.alt) { const t = el("title", {}, im); t.textContent = b.alt; }
		}
		yb = fy + lay.img.h;
	}

	// footer chips
	if (lay.chips.length) {
		const foot = el("text", {x: PAD, y: yb + 8 + 5, class: "foot"}, g);
		lay.chips.forEach((c, i) => {
			if (i) { const sp = el("tspan", {}, foot); sp.textContent = "   "; }
			let host = foot;
			if (c.url) { host = el("a", {href: c.url}, foot); host.addEventListener("click", (ev) => ev.stopPropagation()); }
			const ts = el("tspan", {class: c.cls}, host);
			ts.textContent = c.label;
			if (c.title) { const t = el("title", {}, ts); t.textContent = c.title; }
		});
	}

	g.addEventListener("click", (ev) => {
		if (didDrag) return;
		ev.stopPropagation();
		if (e.tweet) return;                                   // X link is the footer chip only
		if (ev.ctrlKey || ev.metaKey) toggleThread(rkey);      // merge / un-merge this post's thread
		else navigate(rkey);
	});
	return g;
}

const pinsKey = () => PINS.join("|");

// The hash holds the whole view: "<focus>" for a single thread, or
// "<focus>,<root1>,<root2>,…" listing every pinned root for a merged view.
function hashFor(focus, pins) {
	// focus already implies its own thread root, so drop that from the list: a
	// single thread is just "focus", a two-thread merge is "focus,otherRoot".
	const fr = localRoot(focus);
	return [focus, ...pins.filter(p => p !== fr)].join(",");
}

// lastShown tracks the hash we last acted on, so the popstate+hashchange pair a
// single history move fires (and our own writes) don't re-trigger a restore.
function writeHash(focus, pins, replace) {
	const hash = "#" + hashFor(focus, pins);
	if (replace) history.replaceState(null, "", hash);
	else history.pushState(null, "", hash);
	lastShown = location.hash;
}

function parseHash() {
	const parts = decodeURIComponent(location.hash.slice(1)).split(",").filter(Boolean);
	const focus = parts[0];
	if (!focus || !INDEX[focus]) return null;
	// Return the pinned roots verbatim — they may name outside thread roots we
	// don't hold yet (showHash fetches those before pinning). Filtering here is
	// what dropped merged outside threads on reload.
	return {focus, roots: parts.slice(1)};
}

// The one way a view is shown. A view is a focus post plus a set of pinned
// roots; navigate, merge, and hash-restore all funnel through here with a
// different root set. We first fetch any outside thread the roots name (so the
// connecting posts exist), then resolve each root to a concrete local root we
// hold, pin them, and draw — once. The hash is the source of truth, so shared
// URLs and Back/Forward replay the exact (possibly merged) view.
async function showView(focus, roots, push) {
	if (!INDEX[focus]) return;
	const replace = !push || FOCUS === null;        // captured before any await
	// Outside threads referenced by the focus or the pinned roots, not yet pulled in.
	const groups = new Set();
	if (INDEX[focus].xr) groups.add(INDEX[focus].xr);
	for (const r of roots) if (EXTGROUPS[r]) groups.add(r);
	const pending = [...groups].filter(g => EXTSTATE[g] !== "done");
	if (pending.length) {
		setStatus("Loading outside thread…");
		await Promise.all(pending.map(injectGroup));
		setStatus("");
	}
	// Resolve roots to local roots now that the connecting posts are in INDEX;
	// an outside root we couldn't fetch falls back to its group members' roots.
	// Preserve the given order and only append the focus's own root if it's
	// missing — prepending it would reshuffle the trees and change pinsKey, which
	// is what made plain clicks relayout/refit instead of just moving the focus.
	const pins = [], seen = new Set();
	const add = (rk) => { if (rk && !seen.has(rk)) { seen.add(rk); pins.push(rk); } };
	for (const r of roots) {
		if (INDEX[r]) add(localRoot(r));
		else if (EXTGROUPS[r]) EXTGROUPS[r].forEach(m => add(localRoot(m)));
	}
	add(localRoot(focus));
	// Don't reset lastPinsKey: render's fast path then just moves the focus and
	// pans when the pinned set is unchanged (a plain click), and relayouts only
	// when PINS actually changed (a merge, or freshly assembled outside thread).
	FOCUS = focus; PINS = pins;
	writeHash(focus, PINS, replace);
	render(focus);
}

// Normal click: focus a post. If its thread is already on screen, keep the
// current (possibly merged) view and just refocus; otherwise jump to it alone.
function navigate(focus) {
	if (!INDEX[focus]) return;
	const root = localRoot(focus);
	const roots = PINS.includes(root) ? PINS : [root];
	if (focus === FOCUS && roots.join("|") === pinsKey()) return;
	showView(focus, roots, true);
}

// Ctrl/Cmd+click: toggle a thread in the merged view. An off-tree quote adds its
// thread; a node already on screen removes its thread (unless it's the last one,
// moving focus to a survivor if it was in the removed one).
function toggleThread(rkey) {
	if (!INDEX[rkey] || INDEX[rkey].tweet) return;   // tweets have no thread
	const root = localRoot(rkey);
	if (!PINS.includes(root)) { showView(rkey, [...PINS, root], true); return; }
	if (PINS.length === 1) return;                   // can't drop the last thread
	const pins = PINS.filter(p => p !== root);
	showView(localRoot(FOCUS) === root ? pins[0] : FOCUS, pins, true);
}

function render(focus) {
	FOCUS = focus;
	$("#hint").style.display = "none";

	// keep the sidebar's active highlight in sync as the pinned set changes (the
	// list isn't rebuilt on navigation): a row is active when its graph is pinned.
	document.querySelectorAll("#sidebar li[data-group]").forEach(it =>
		it.classList.toggle("active", PINS.includes(it.dataset.group)));

	// Same pinned set already on screen → no relayout/refit; just move the focus
	// highlight and pan the new post into view if it's off-screen.
	if (pinsKey() === lastPinsKey && lastPos && lastPos[focus]) {
		setFocusNode(focus);
		panIntoView(focus);
		return;
	}

	const {tree, quoteEdges, satNodes, satEdges, treeKids, grafts} = buildVisible(PINS);

	// Per-node wrapped text + height, cached for this view.
	const LAY = {};
	const H = (rk) => LAY[rk].h;
	for (const rk of tree) LAY[rk] = nodeLayout(rk);
	for (const s of satNodes) if (!LAY[s.rkey]) LAY[s.rkey] = nodeLayout(s.rkey);

	// Pass 1: provisional layout (no quote gutters) → positions + depths.
	const pos1 = layoutForest(PINS, tree, treeKids, null);

	// Rows: each depth's top = sum of taller rows above it, so variable-height
	// boxes never overlap vertically while siblings stay aligned. (depth + height
	// are fixed, so these rows are final and survive pass 2.)
	let maxDepth = 0;
	for (const rk of tree) maxDepth = Math.max(maxDepth, pos1[rk].depth);
	const depthH = new Array(maxDepth + 1).fill(0);
	for (const rk of tree) depthH[pos1[rk].depth] = Math.max(depthH[pos1[rk].depth], H(rk));
	const rowTop = new Array(maxDepth + 1);
	for (let d = 0, acc = 0; d <= maxDepth; d++) { rowTop[d] = acc; acc += depthH[d] + V_GAP; }

	// Group quotes by anchor; pick the outward side (fan away from tree centre)
	// and the row span each quote stack covers, using pass-1 positions + rows.
	const anchorSats = {};
	for (const s of satNodes) (anchorSats[s.anchor] || (anchorSats[s.anchor] = [])).push(s);
	let cMin = Infinity, cMax = -Infinity;
	for (const rk of tree) { cMin = Math.min(cMin, pos1[rk].x); cMax = Math.max(cMax, pos1[rk].x + NODE_W); }
	const center = (cMin + cMax) / 2;
	const side = {}, span = {};
	for (const a in anchorSats) {
		side[a] = (pos1[a].x + NODE_W / 2) < center ? "L" : "R";
		let hsum = 0;
		anchorSats[a].forEach((s, i) => { hsum += LAY[s.rkey].h + (i ? SAT_VGAP : 0); });
		const d = pos1[a].depth, yBottom = rowTop[d] + hsum;
		let k = 0;
		while (d + k + 1 <= maxDepth && rowTop[d + k + 1] < yBottom) k++;
		span[a] = k;
	}

	// Pass 2: re-layout reserving each anchor's gutter, so the tree relaxes around
	// the quotes. Rows are unchanged (depths fixed), so reuse rowTop for y.
	const res = {side, span, gutterOffset: {}};
	const pos = layoutForest(PINS, tree, treeKids, res);
	for (const rk of tree) pos[rk].y = rowTop[pos[rk].depth];

	// Slide each merged lane vertically so its quote connection lines up with the
	// post it branches from, instead of every tree starting at the top row. Lanes
	// sit in separate horizontal bands (FOREST_GAP), so a vertical shift can't
	// collide. Process in pin order so a lane anchors to an already-placed one.
	if (PINS.length > 1) {
		const laneOf = {};
		PINS.forEach((root, i) => (function walk(rk) {
			if (laneOf[rk] !== undefined) return;
			laneOf[rk] = i;
			for (const c of treeKids[rk]) walk(c);
		})(root));
		for (let i = 1; i < PINS.length; i++) {
			const link = quoteEdges.find(e =>
				(laneOf[e.from] === i && laneOf[e.to] < i) || (laneOf[e.to] === i && laneOf[e.from] < i));
			if (!link) continue;
			const mine = laneOf[link.from] === i ? link.from : link.to;   // endpoint in this lane
			const dy = pos[mine === link.from ? link.to : link.from].y - pos[mine].y;
			if (dy) for (const rk of tree) if (laneOf[rk] === i) pos[rk].y += dy;
		}
	}

	// Drop each anchor's quotes into its reserved gutter, stacked from its row.
	const satPos = {};
	for (const a in anchorSats) {
		const gx = pos[a].x + res.gutterOffset[a];
		let y = pos[a].y;
		for (const s of anchorSats[a]) { satPos[s.rkey] = {x: gx, y}; y += LAY[s.rkey].h + SAT_VGAP; }
	}

	// ---- render ----
	scene.innerHTML = "";
	const edgeLayer = el("g", {}, scene);
	const nodeLayer = el("g", {}, scene);

	// reply edges (parent bottom → child top); grafted quote-replies are amber,
	// links involving a fetched outside post are green (the external colour)
	for (const rk of tree) {
		for (const c of treeKids[rk]) {
			const cls = grafts.has(c) ? "edge graft"
				: (INDEX[rk].external || INDEX[c].external) ? "edge extedge" : "edge";
			drawEdge(edgeLayer, pos[rk].x + NODE_W / 2, pos[rk].y + H(rk),
													pos[c].x + NODE_W / 2, pos[c].y, cls);
		}
	}
	// quote edges within tree — arrow lands on the quoted post
	for (const {from, to} of quoteEdges)
		el("path", {d: quoteCurve(pos[from], pos[to], H(from), H(to)), class: "edge quoteedge"}, edgeLayer);
	// satellite quote edges — one per link, so a shared target gets several arrows
	for (const e of satEdges) {
		const d = e.dir === "out"
			? quoteCurve(pos[e.anchor], satPos[e.sat], H(e.anchor), H(e.sat))
			: quoteCurve(satPos[e.sat], pos[e.anchor], H(e.sat), H(e.anchor));
		el("path", {d, class: "edge quoteedge"}, edgeLayer);
	}

	// nodes
	for (const rk of tree) {
		const g = grafts.has(rk);
		const badge = g ? (INDEX[rk].tweet ? "𝕏 " + (INDEX[rk].a || "post") : "↪ quoted")
			: INDEX[rk].external ? "@" + (INDEX[rk].handle || "") : null;
		const cls = [rk === focus && "focus", PINS.length > 1 && PINS.includes(rk) && "root"].filter(Boolean).join(" ");
		drawNode(nodeLayer, rk, pos[rk].x, pos[rk].y, LAY[rk], cls, badge, g);
	}
	for (const s of satNodes) {
		const badge = INDEX[s.rkey].tweet ? "𝕏 " + (INDEX[s.rkey].a || "post")
													: s.dir === "out" ? "↳ quoted" : "quotes →";
		drawNode(nodeLayer, s.rkey, satPos[s.rkey].x, satPos[s.rkey].y, LAY[s.rkey], "quote", badge, false);
	}

	// fit to every placed box (tree + satellites, which may sit left or below)
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	for (const rk of tree) {
		minX = Math.min(minX, pos[rk].x); minY = Math.min(minY, pos[rk].y);
		maxX = Math.max(maxX, pos[rk].x + NODE_W); maxY = Math.max(maxY, pos[rk].y + H(rk));
	}
	for (const s of satNodes) {
		const p = satPos[s.rkey];
		minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
		maxX = Math.max(maxX, p.x + NODE_W); maxY = Math.max(maxY, p.y + H(s.rkey));
	}
	lastPinsKey = pinsKey(); lastPos = pos; lastH = H; lastBounds = [minX, minY, maxX, maxY];
	fitView(minX, minY, maxX, maxY);
	markSearchHits();                            // freshly drawn nodes pick up the active search
}

const rkeyOf = (uri) => uri.split("/").pop();

// Add a fetched outside post to INDEX as a real (external) node, if we don't
// already hold it. Our own posts stay untouched.
function injectExternal(post) {
	const rk = rkeyOf(post.uri);
	if (INDEX[rk]) return rk;
	INDEX[rk] = {
		external: true,
		did: post.author.did,
		handle: post.author.handle || "",
		t: (post.record && post.record.text) || "",
		d: (post.record && post.record.createdAt) || "",
		rkey: rk,
	};
	if (post.record && post.record.facets) INDEX[rk].f = post.record.facets;
	children[rk] = children[rk] || [];
	quotedBy[rk] = quotedBy[rk] || [];
	return rk;
}

// Record that childRk is a reply to parentRk (sets the parent pointer on fetched
// nodes and wires up the child list so the reply tree can walk through them).
function linkReply(parentRk, childRk) {
	if (INDEX[childRk] && INDEX[childRk].external) INDEX[childRk].p = parentRk;
	const kids = children[parentRk] || (children[parentRk] = []);
	if (!kids.includes(childRk)) {
		kids.push(childRk);
		kids.sort((a, b) => (INDEX[a].d || "").localeCompare(INDEX[b].d || ""));
	}
}

// Pull in the connecting outside posts for one outside-thread group and inject
// them as green nodes, so our posts that share that root chain together through
// them. For each member we ask the public AppView for a couple of ancestors
// (getPostThread with a small parentHeight). Pure data side-effect — no pinning
// or rendering. Guarded by EXTSTATE so each root is fetched once; concurrent
// callers await the same in-flight promise. No auth needed.
function injectGroup(root) {
	if (EXTSTATE[root]) return EXTSTATE[root] === "done" ? Promise.resolve() : EXTSTATE[root];
	const job = (async () => {
		const members = EXTGROUPS[root] || [];
		const chains = await Promise.all(members.map(async (m) => {
			try {
				const uri = `at://${DID}/app.bsky.feed.post/${m}`;
				const resp = await fetch(`${APPVIEW}/app.bsky.feed.getPostThread`
					+ `?uri=${encodeURIComponent(uri)}&depth=0&parentHeight=2`);
				if (!resp.ok) return null;
				return (await resp.json()).thread;
			} catch (err) { console.warn("injectGroup fetch failed", err); return null; }
		}));
		for (const thread of chains) {
			// Walk the parent links upward: each node's post is the parent of the one
			// below it. Stop at the root or at a deleted/blocked node (no .post).
			let node = thread, childRk = null;
			while (node && node.post && node.post.uri) {
				const rk = node.post.author.did === DID ? rkeyOf(node.post.uri) : injectExternal(node.post);
				if (childRk) linkReply(rk, childRk);
				childRk = rk;
				node = node.parent;
			}
		}
		EXTSTATE[root] = "done";
	})();
	EXTSTATE[root] = job;
	return job;
}

// Restore the view encoded in the hash (shared link, reload, Back/Forward).
// Just hand the focus + named roots to showView, which fetches what it needs.
function showHash(initial) {
	if (!initial && location.hash === lastShown) return;   // popstate+hashchange both fire one move
	lastShown = location.hash;
	const v = parseHash();
	if (v) showView(v.focus, v.roots, false);
	else { const f = topThreads()[0]; if (f) navigate(f.rkey); }
}

// Move the .focus highlight to a node without redrawing (data-rkey set on each).
function setFocusNode(focus) {
	scene.querySelectorAll("g.node.focus").forEach(n => n.classList.remove("focus"));
	const n = scene.querySelector(`g.node[data-rkey="${CSS.escape(focus)}"]`);
	if (n) n.classList.add("focus");
}

// Ring the graph nodes whose text matches the search box, so a post can be found
// in the tree the way it can in the sidebar. Re-run after every render (nodes are
// rebuilt) and on each keystroke.
function markSearchHits() {
	const q = $("#q").value.trim().toLowerCase();
	for (const n of scene.querySelectorAll("g.node"))
		n.classList.toggle("hit", !!q && searchText(INDEX[n.dataset.rkey]).includes(q));
}

// Pan just enough to bring a node fully into view; if it's already visible, do nothing.
function panIntoView(focus) {
	const p = lastPos[focus];
	if (!p) return;
	const h = lastH(focus), m = 40, rect = svg.getBoundingClientRect();
	const x1 = p.x * scale + tx, y1 = p.y * scale + ty;
	const x2 = x1 + NODE_W * scale, y2 = y1 + h * scale;
	let dx = 0, dy = 0;
	if (x1 < m) dx = m - x1; else if (x2 > rect.width - m) dx = rect.width - m - x2;
	if (y1 < m) dy = m - y1; else if (y2 > rect.height - m) dy = rect.height - m - y2;
	if (dx || dy) { tx += dx; ty += dy; applyTransform(); }
}

// Quote-edge path from box s to box d, with the arrow landing on d. The control
// arms run along the actual p1→p2 connector (with a gentle bow), so the edge
// always flows p1→p2 and the arrowhead (marker orient=auto) points the way it
// travels — at every length.
const EDGE_OFF = 14;
function quoteCurve(s, d, hs, hd) {
	const scx = s.x + NODE_W / 2, scy = s.y + hs / 2;
	const dcx = d.x + NODE_W / 2, dcy = d.y + hd / 2;
	// Attach on the facing edges: the dominant axis picks left/right vs top/bottom
	// faces, and the endpoints are nudged oppositely along the other axis so an
	// outgoing and an incoming edge on the same side don't sit on top of each other.
	let p1, p2;
	if (Math.abs(dcx - scx) >= Math.abs(dcy - scy)) {
		p1 = {x: dcx >= scx ? s.x + NODE_W : s.x, y: scy + EDGE_OFF};
		p2 = {x: dcx >= scx ? d.x : d.x + NODE_W, y: dcy - EDGE_OFF};
	} else {
		p1 = {x: scx + EDGE_OFF, y: dcy >= scy ? s.y + hs : s.y};
		p2 = {x: dcx - EDGE_OFF, y: dcy >= scy ? d.y : d.y + hd};
	}
	// Arms along the connector (not the centre chord): on short edges the facing
	// attach points can sit crossed relative to the box centres, so chord-aligned
	// arms point the wrong way (and fold the curve). The perpendicular bow, scaled
	// to length, keeps a readable arc; it flips for the reverse direction so an
	// outgoing and incoming edge between the same pair bow to opposite sides.
	const ax = p2.x - p1.x, ay = p2.y - p1.y, span = Math.hypot(ax, ay) || 1;
	const ux = ax / span, uy = ay / span, k = span * 0.35;
	const bow = Math.min(span * 0.12, 22);
	const c1 = {x: p1.x + ux * k - uy * bow, y: p1.y + uy * k + ux * bow};
	const c2 = {x: p2.x - ux * k - uy * bow, y: p2.y - uy * k + ux * bow};
	return `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
}

function fitView(minX, minY, maxX, maxY) {
	const rect = svg.getBoundingClientRect();
	const w = maxX - minX, h = maxY - minY;
	const margin = 40;
	const s = Math.min((rect.width - margin) / w, (rect.height - margin) / h, 1.4);
	scale = Math.max(0.05, s);
	tx = (rect.width - w * scale) / 2 - minX * scale;
	ty = Math.max(margin / 2, (rect.height - h * scale) / 2) - minY * scale;
	applyTransform();
}

// ---------- interaction (pointer events cover mouse, touch and pen) ----------
// #graph sets touch-action:none, so the browser hands us all touch gestures; we
// drive pan from one pointer and pinch-zoom from two. didDrag suppresses the
// node click after a drag/pinch (a clean tap leaves it false, so taps navigate).
let panning = false, didDrag = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
const pointers = new Map();                    // live pointers: id -> {x, y}
let pinchDist = 0, pinchMx = 0, pinchMy = 0;   // last pinch gap + midpoint (svg-local)

// Zoom by `factor` about a point (px,py) measured from the svg's top-left, so the
// point under the cursor / pinch centre stays put. Shared by wheel and pinch.
function zoomAt(factor, px, py) {
	const ns = Math.max(0.05, Math.min(3, scale * factor));
	tx = px - (px - tx) * (ns / scale);
	ty = py - (py - ty) * (ns / scale);
	scale = ns;
	applyTransform();
}

function startPinch() {
	const [a, b] = [...pointers.values()];
	const rect = svg.getBoundingClientRect();
	pinchDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
	pinchMx = (a.x + b.x) / 2 - rect.left;
	pinchMy = (a.y + b.y) / 2 - rect.top;
}

svg.addEventListener("pointerdown", (e) => {
	pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
	if (pointers.size >= 2) {                     // second finger → pinch, not pan
		panning = false;
		startPinch();
		return;
	}
	// Single pointer: pan only when the press starts on empty canvas. Starting
	// inside a node leaves the text selectable (no grab) — we still track movement
	// below so a drag-to-select there doesn't also count as a click.
	didDrag = false;
	startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
	panning = !e.target.closest(".node");
	if (panning) svg.classList.add("grabbing");
});

window.addEventListener("pointermove", (e) => {
	if (!pointers.has(e.pointerId)) return;
	pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
	if (pointers.size >= 2) {                    // pinch: zoom about the midpoint, pan by its drift
		const [a, b] = [...pointers.values()];
		const rect = svg.getBoundingClientRect();
		const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
		const mx = (a.x + b.x) / 2 - rect.left, my = (a.y + b.y) / 2 - rect.top;
		zoomAt(dist / pinchDist, mx, my);
		tx += mx - pinchMx; ty += my - pinchMy;
		applyTransform();
		pinchDist = dist; pinchMx = mx; pinchMy = my;
		didDrag = true;
	} else {                                     // single pointer
		const dx = e.clientX - startX, dy = e.clientY - startY;
		if (Math.abs(dx) + Math.abs(dy) > 3) didDrag = true;   // suppress the click (drag, not tap)
		if (panning) { tx = startTx + dx; ty = startTy + dy; applyTransform(); }   // pan only off empty canvas
	}
});

function endPointer(e) {
	pointers.delete(e.pointerId);
	if (pointers.size === 1) {                   // dropped from pinch to one finger: resume panning
		const [p] = [...pointers.values()];
		panning = true; didDrag = true;            // still mid-gesture, so not a tap
		startX = p.x; startY = p.y; startTx = tx; startTy = ty;
	} else if (pointers.size === 0) {
		panning = false; svg.classList.remove("grabbing");
	}
}
window.addEventListener("pointerup", endPointer);
window.addEventListener("pointercancel", endPointer);

svg.addEventListener("wheel", (e) => {
	e.preventDefault();
	const rect = svg.getBoundingClientRect();
	zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - rect.left, e.clientY - rect.top);
}, {passive: false});

$("#fit").onclick = () => { if (lastBounds) fitView(...lastBounds); };
// type=search clears via the native ✕ (and Esc); its input event rebuilds the list.
$("#q").addEventListener("input", () => { buildSidebar(); markSearchHits(); });

// Hovering a sidebar row draws a box around the run of rows in the same tree.
// Results are clustered by tree, so the run is contiguous; we just span from the
// first matching row's top to the last's bottom. Only shown for 2+ rows (a lone
// match needs no box — plain :hover covers it). Delegated so it survives rebuilds;
// kinGroup guards against recomputing on every mousemove within a row.
let kinGroup = null;
const setKin = (group) => {
	if (group === kinGroup) return;
	kinGroup = group;
	// Tint every row of the hovered group (reliable, no positioning math)…
	const all = $("#sidebar").querySelectorAll("li[data-group]");
	all.forEach(li => li.classList.toggle("kin", group != null && li.dataset.group === group));
	// …and draw the enclosing box over the run when it's a real group (2+ rows).
	const box = $("#kinbox");
	if (!box) return;
	const rows = group == null ? [] : [...all].filter(li => li.dataset.group === group);
	if (rows.length < 2) { box.style.display = "none"; return; }
	let top = Infinity, bot = -Infinity;
	for (const r of rows) { top = Math.min(top, r.offsetTop); bot = Math.max(bot, r.offsetTop + r.offsetHeight); }
	box.style.top = top + "px";
	box.style.height = (bot - top) + "px";
	box.style.display = "block";
};
$("#sidebar").addEventListener("mouseover", (e) => {
	const li = e.target.closest("li[data-group]");
	setKin(li ? li.dataset.group : null);
});
$("#sidebar").addEventListener("mouseleave", () => setKin(null));
// Hiding the list (CSS) widens the canvas; refit to use it.
$("#hidelist").addEventListener("change", () => { if (lastBounds) fitView(...lastBounds); });
// Back/Forward (popstate) and manual hash edits (hashchange) restore the named
// view, fetching any outside threads it references. Both events fire for one
// history move; showHash's lastShown guard collapses them to a single restore.
window.addEventListener("popstate", () => showHash(false));
window.addEventListener("hashchange", () => showHash(false));
load();   // module is deferred, so the DOM is ready
</script>
</body>
</html>
