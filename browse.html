<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The archive file is named after the owner DID; the Dockerfile substitutes this href
     at build time. Read by JS for both the fetch URL and the owner-DID identity check. -->
<link rel="archive" href="__ARCHIVE_FILE__">
<title>Thread Browser</title>
<script>
	// Apply a saved theme choice before first paint, so there's no flash. With no
	// saved choice we leave color-scheme:light dark (set in CSS), which follows the OS.
	{ const t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.style.colorScheme = t; }
</script>
<!-- flexforest default stylesheet: the view's motion + structure (transitions, enter/leave,
     fold-tag cursor, camera surface). Linked first so the rules below can override colours
     and retune the --ff-* timing custom properties. -->
<link rel="stylesheet" href="flexforest/flexforest.css">
<style>
	:root {
		color-scheme: light dark;
		--line: color-mix(in srgb, CanvasText 22%, transparent);
		--faint: color-mix(in srgb, CanvasText 7%, transparent);
		--edge: color-mix(in srgb, CanvasText 42%, transparent);
		--quote: #c79a4a;
		--tweet: #5b9bd5;
		--ext: #4aa564;
		--kin: #b07cff;   /* sidebar same-tree highlight; saturated so it shows in light & dark */
		/* light-dark(lightValue, darkValue) — resolves against the active color-scheme,
		   so these soften light mode without touching dark. */
		--paper: light-dark(#f6f1e2, Canvas);   /* page + graph background: warm cream on light, system on dark */
		--header: light-dark(color-mix(in srgb, AccentColor 13%, #efe6d0), color-mix(in srgb, AccentColor 16%, Canvas));
		--hit: #f5c518;                         /* search-result highlight: bright yellow, reads in both light & dark */
		/* Raised chrome (header, sidebar) sits a shade above the cream work surface and
		   floats on a soft two-layer shadow (Ptable's elevation). In dark mode the panel
		   is *lighter* than the recess — that's how depth reads on a dark ground. */
		--panel: light-dark(#fdfaf3, color-mix(in srgb, CanvasText 6%, Canvas));
		--shadow-a: light-dark(rgba(0,0,0,.08), rgba(0,0,0,.34));   /* wide & soft */
		--shadow-b: light-dark(rgba(0,0,0,.16), rgba(0,0,0,.5));    /* tight key */
	}
	html, body { height: 100%; margin: 0; }
	body {
		font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		color: CanvasText; background: var(--paper);
		display: flex; flex-direction: column;
	}
	body > header {
		display: flex; gap: 0.5em 0.8em; align-items: center; flex-wrap: wrap;
		padding: 0.4em 0.8em; background: var(--header);
		border-bottom: 1px solid color-mix(in srgb, AccentColor 35%, var(--header));
		flex: 0 0 auto;
		position: relative; z-index: 2;   /* float above the row so its shadow casts down */
		box-shadow: 0 2px 5px var(--shadow-a), 0 1px 2px var(--shadow-b);
	}
	header input { padding: 0.3em 0.5em; font: inherit; }
	#q { width: 12em; }
	#url { flex: 1 1 16em; }   /* address bar: shows the current hash, editing it loads a thread */
	#avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
	#account { display: flex; flex-direction: column; line-height: 1.2; margin-right: auto; font-style: normal; }
	#acctName { font-weight: 600; color: CanvasText; }
	#acctName a { color: LinkText; text-decoration: none; font-weight: 500; }
	#acctName a:hover { text-decoration: underline; }
	#listToggle { cursor: pointer; font-size: 1.2em; line-height: 1; user-select: none; color: GrayText; }
	/* Show/hide the list by collapsing its grid column — animated (see main below), so it
	   slides rather than popping; the panel's padding/border/shadow flatten too so nothing
	   peeks at 0 width. Auto-hides when the focused post isn't ours and nothing is being
	   searched (list + search cover only our own archive — also blank in API-only mode);
	   a query in #q brings it back. */
	/* Manual ☰ close always wins. Off-site auto-hide yields to an active search so the
	   match list is visible — onsite, the user already has a deliberate handle (the ☰). */
	#hidelist:checked ~ main,
	body.offsite:not(:has(#q:not(:placeholder-shown))) main { grid-template-columns: 0 1fr; }
	#hidelist:checked ~ main #sidebar,
	body.offsite:not(:has(#q:not(:placeholder-shown))) #sidebar { padding: 0; border-right-width: 0; box-shadow: none; }
	#acctDesc { color: GrayText; }
	#status { color: GrayText; font-size: 0.85em; }

	main { flex: 1 1 auto; display: grid; grid-template-columns: 260px 1fr; min-height: 0; transition: grid-template-columns .3s ease; }
	aside {
		font-size: 0.85em; overflow: hidden auto; min-width: 0;   /* min-width:0 lets the grid item shrink to a 0 track */
		padding: 0.5em; border-right: 1px solid var(--line); background: var(--panel);
		position: relative; z-index: 1;   /* raised panel; its edge shadow falls on the graph */
		box-shadow: 3px 0 6px var(--shadow-a);
		transition: padding .3s ease, border-right-width .3s ease, box-shadow .3s ease;
	}
	aside h3 { margin: 0.2em 0 0.5em; font-size: 0.8em; color: GrayText; text-transform: uppercase; letter-spacing: 0.05em; }
	aside ul { list-style: none; margin: 0; padding: 0; position: relative; }
	aside li { padding: 0.4em 0.3em; cursor: pointer; border-bottom: 1px solid var(--faint); color: CanvasText; overflow-wrap: anywhere; }
	aside li:hover { background: var(--faint); }
	/* Rows in the same tree as the hovered row: a saturated translucent overlay
	   (mixed with transparent, not Canvas, so it shows in dark mode too) plus a
	   bold bar down the side. */
	aside li.kin { background: color-mix(in srgb, var(--kin) 20%, transparent); box-shadow: inset 3px 0 0 var(--kin); }
	aside li.active { background: color-mix(in srgb, AccentColor 30%, Canvas); }
	/* Box drawn over the run of those rows, reinforcing them as one group. */
	#kinbox { position: absolute; left: 0; right: 0; display: none; pointer-events: none;
		box-sizing: border-box;   /* without this, left/right:0 sizes the content box and the 2px border overflows the column */
		border: 2px solid var(--kin); border-radius: 5px;
		background: color-mix(in srgb, var(--kin) 14%, transparent); }
	aside li small { display: block; color: GrayText; }
	/* search match: the same yellow the graph rings matches with */
	aside mark { background: color-mix(in srgb, var(--hit) 30%, transparent); color: inherit; border-radius: 2px; }

	#view { position: relative; min-width: 0; min-height: 0; }
	/* cursor + touch-action live in flexforest.css (.ff-graph), added to the svg by the view. */
	#graph { width: 100%; height: 100%; display: block; background:
		repeating-linear-gradient(0deg,var(--faint) 0 1px,transparent 1px 26px),
		repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px 26px), var(--paper); }

	/* `> rect` targets only the post's own box (a direct child), not the rects nested
	   inside cards or toggles — so a quote/tweet box border doesn't bleed into them. */
	.node > rect { fill: Canvas; stroke: var(--line); stroke-width: 1.2; rx: 6; }
	.node:hover > rect { stroke: AccentColor; }
	/* Authorship colour: every authored post is tinted by default; the ones by the focused
	   post's author carry .focal (set in JS on each (re)focus) and reset to the plain white
	   card. Placed after .au (overrides the tint) and before the selection states below. */
	.node.au > rect { fill: color-mix(in srgb, var(--ext) 13%, Canvas); stroke: var(--ext); }
	.node.focal > rect { fill: Canvas; stroke: var(--line); }
	.node.quote > rect { fill: color-mix(in srgb, var(--quote) 10%, Canvas); stroke: color-mix(in srgb, var(--quote) 55%, var(--line)); stroke-dasharray: 4 3; }   /* off-tree quote */
	.node.tweet > rect { fill: color-mix(in srgb, var(--tweet) 14%, Canvas); stroke: var(--tweet); }   /* a quoted tweet */
	/* selection states last, so a ring always shows over any author/type colour */
	.node.hit > rect { stroke: var(--hit); stroke-width: 2.5; fill: color-mix(in srgb, var(--hit) 18%, Canvas); }
	.node.focus > rect { fill: color-mix(in srgb, AccentColor 16%, Canvas); stroke: AccentColor; stroke-width: 2; }
	.node.root > rect { stroke-width: 3.5; }   /* a pinned thread root — ⌘-click to remove it */
	.node .dbl { fill: none; stroke: var(--quote); stroke-width: 1; }

	/* A post is an HTML card inside a <foreignObject>: the browser wraps the text and
	   lays out the media. The SVG rect behind it draws the border/fill, so the card is
	   transparent. One offscreen copy (.measure) is sized to read each post's height. */
	.post { width: 240px; box-sizing: border-box; padding: 8px 11px; background: transparent;
		font-family: inherit; font-size: 12px; line-height: 1.36; color: CanvasText; cursor: default;
		overflow-wrap: anywhere; }
	.post.measure { position: absolute; left: -9999px; top: 0; visibility: hidden; }
	.node.quote:not(.tweet) .post { cursor: pointer; }   /* a satellite click loads its own graph */
	.post header { display: flex; gap: 5px; align-items: center;
		font-size: 0.83em; color: GrayText; margin-bottom: 3px; }
	.post .avatar { width: 1.35em; height: 1.35em; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
	/* Quote-satellite relationship labels, generated by the cascade (no JS): outgoing
	   leads before the icon with ↳ pointing into the quoted author; incoming trails the
	   name with a quieter →. The header is flex, so ::before becomes the first item. */
	.node.qout .post header::before { content: "quoted ↳"; white-space: nowrap; }
	.node.qin .post .badge::after { content: " → quotes"; font-weight: 400; }
	.post .badge { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.post a.badge { color: inherit; text-decoration: none; }
	.post a.badge:hover { text-decoration: underline; }
	.post .date { color: GrayText; text-decoration: none; white-space: nowrap; flex: 0 0 auto; margin-left: auto; }
	.post a.date:hover { color: LinkText; text-decoration: underline; }
	.post .body { white-space: pre-wrap; }
	.post .body ~ * { margin-top: 6px; }   /* every block below the body is spaced once, here */
	.post .lnk { color: LinkText; }
	.post .men, .post .tag { color: LinkText; }
	.post .dim { color: GrayText; }
	.post img.media { display: block; width: 100%; height: 120px; max-height: 360px; object-fit: cover; border-radius: 5px; }   /* height is overridden to the image's real aspect-ratio when known; 120px is the fallback */
	.post a.card { display: flex; gap: 8px; align-items: center; padding: 6px; text-decoration: none; color: inherit;
		border: 1px solid color-mix(in srgb, CanvasText 12%, transparent); border-radius: 6px;
		background: color-mix(in srgb, CanvasText 4%, Canvas); }
	.post a.card .cardthumb { width: 56px; height: 56px; flex: 0 0 auto; object-fit: cover; border-radius: 4px; }
	.post a.card .cardtext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
	.post a.card b { font-size: 0.92em; }
	.post a.card i { font-size: 0.83em; font-style: normal; color: GrayText; }
	.post a.card small { font-size: 0.8em; color: GrayText; }
	.post a.card :is(b, i, small) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.post video.media { display: block; width: 100%; aspect-ratio: 16/9; max-height: 360px; object-fit: contain; background: #000; border-radius: 5px; }
	.post .clink { display: inline-block; color: LinkText; text-decoration: none; font-size: 0.85em; }
	/* One footer row: any non-zero interaction counts on the left, copy-text button on the
	   right, all evenly distributed. When there are no counts (archive posts), the copy
	   button hugs the right edge instead of stranding alone on the left. */
	.post footer { display: flex; align-items: center; justify-content: flex-end;
		color: GrayText; font-size: 0.82em; margin-top: 6px; }
	.post footer:has(span, a.reply) { justify-content: space-between; }
	.post footer :is(span, a.reply) { display: inline-flex; align-items: center; gap: 4px; }
	.post footer a.reply { color: inherit; text-decoration: none; transition: color .15s; }
	.post footer a.reply:hover { color: LinkText; }
	.post footer svg { width: 13px; height: 13px; flex: 0 0 auto; }
	.post .copy { width: 15px; height: 15px; padding: 0; background: none; border: 0;
		cursor: pointer; color: inherit; transition: color .15s; }
	.post .copy:hover { color: LinkText; }
	.post .copy svg { display: block; width: 100%; height: 100%; }
	/* .ctoggle cursor lives in flexforest.css; colours stay here. */
	.ctoggle .ctbg { fill: Canvas; stroke: var(--edge); stroke-width: 1.2; }
	.ctoggle:hover .ctbg { stroke: AccentColor; }
	.ctoggle .ctlbl { fill: GrayText; font-size: 11px; }
	/* the canvas shows a grab cursor; stop it at the node so content is default and
	   links/satellites pick their own (handled above). Motion — the transform/opacity
	   transitions and the .enter/.leave resting state — lives in flexforest.css. */
	.node { cursor: auto; }

	.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
	.edge.quoteedge { stroke: var(--quote); stroke-dasharray: 5 4; marker-end: url(#qarrow); }
	.edge.graft { stroke: var(--quote); }

	/* graph-area overlays: a shared chip look for the legend (bottom-left), the help
	   text (bottom-right), and the Fit/theme controls (top corners). */
	#legend, #help, .ctrl {
		position: absolute; background: color-mix(in srgb, Canvas 88%, transparent);
		border: 1px solid var(--line); border-radius: 5px; color: GrayText;
	}
	#legend, #help { bottom: 10px; padding: 0.3em 0.6em; font-size: 0.78em; }
	#legend { left: 10px; }
	#help { right: 10px; max-width: 15em; text-align: right; }
	#legend svg { vertical-align: middle; }
	#legend .reply { stroke: var(--edge); }
	#legend .quote { stroke: var(--quote); }
	#legend .otherswatch { fill: color-mix(in srgb, var(--ext) 13%, Canvas); stroke: var(--ext); }
	.ctrl { top: 10px; display: flex; align-items: center; padding: 0.35em; cursor: pointer; color: CanvasText; }
	.ctrl svg { width: 1.15em; height: 1.15em; display: block; }
	#fit { left: 10px; }
	#theme { background: none; border: 0; padding: 0.25em; cursor: pointer; color: CanvasText; display: flex; align-items: center; }
	#theme svg { width: 1.15em; height: 1.15em; display: block; }
	.hint { position: absolute; inset: 0; display: grid; place-items: center; color: GrayText; padding: 2em; text-align: center; }
</style>
</head>
<body>
<input type="checkbox" id="hidelist" hidden>
<header>
	<label for="hidelist" id="listToggle" title="Show/hide the list">☰</label>
	<img id="avatar" alt="" hidden>
	<address id="account">
		<span id="acctName"></span>
		<small id="acctDesc"></small>
	</address>
	<input id="url" type="text" spellcheck="false" placeholder="post URL or thread id…">
	<input id="q" type="search" placeholder="search posts…">
	<button id="theme" title="Toggle light / dark" aria-label="Toggle light / dark theme">
		<svg viewBox="0 0 16 16" aria-hidden="true">
			<circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
			<path d="M8 1.4 A6.6 6.6 0 0 1 8 14.6 Z" fill="currentColor"/>
		</svg>
	</button>
	<span id="status"></span>
</header>
<main>
	<aside id="sidebar"></aside>
	<section id="view">
		<svg id="graph">
			<defs>
				<marker id="qarrow" viewBox="0 0 9 8" refX="8" refY="4"
								markerWidth="9" markerHeight="8" orient="auto">
					<!-- small open chevron, stroked at the edge's own width (markerUnits=strokeWidth)
					     so the head matches the line; context-stroke inherits the edge colour. -->
					<path d="M1,1 L8,4 L1,7" fill="none" stroke="context-stroke"
								stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
				</marker>
				<!-- Universal copy glyph: two rounded rectangles offset. Referenced via <use> from
				     each post's footer (bottom-right) so the same paths are reused everywhere. -->
				<symbol id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
					<rect x="3" y="3" width="13" height="13" rx="2"/>
					<rect x="8" y="8" width="13" height="13" rx="2"/>
				</symbol>
				<!-- Interaction-count glyphs (reply / repost / like) — bsky.app uses the Phosphor
				     icon set; these are the same visual family at the sizes posts render at. -->
				<symbol id="reply-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
				</symbol>
				<symbol id="repost-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
					<polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
				</symbol>
				<symbol id="like-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
								stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
				</symbol>
			</defs>
		</svg>
		<button id="fit" class="ctrl" title="Fit to view" aria-label="Fit to view">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M12 4v16M4 12h16"/><path d="M9 7l3-3 3 3M9 17l3 3 3-3M7 9l-3 3 3 3M17 9l3 3-3 3"/>
			</svg>
		</button>
		<div id="help">⌘/ctrl-click a quote to merge its thread; a bold root to remove it</div>
		<div id="legend">
			<svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="reply" stroke-width="1.4"/></svg> reply&nbsp;&nbsp;
			<svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="quote" stroke-width="1.4" stroke-dasharray="5 4"/></svg> quote&nbsp;&nbsp;
			<svg width="14" height="11"><rect x="0.5" y="0.5" width="13" height="10" rx="2" class="otherswatch"/></svg> other author
		</div>
		<p class="hint" id="hint">Loading…</p>
	</section>
</main>

<script type="module">
// ES module: strict by default, module-scoped (no globals leak), and deferred —
// so the DOM is already parsed when this runs.
// Pure, DOM-free layout engine (visible-subgraph build, text wrap, flextree forest).
// We hand it the data model by reference; it hands back geometry. render() draws it.
import { initLayout, buildVisible, localRoot, isLocalRoot, isAncestor, isNoise, descendantCount,
	NODE_W, GAPS } from "./layout.js";
import { FlexForest } from "./flexforest/flexforest-view.js";
// index entries are compact: { t:text, d:createdAt, p:parentRkey?, q:[quoted]?,
//   f:facets?, alt:[strings]?, ext:{u,t,d}?, img:n?, vid:true?, xp:parentDid? }
// xp/xr/xrd are set when a reply targets someone else's post (the parent isn't
// in the archive): xp = parent DID, xr = thread root rkey, xrd = root DID. When such
// a post is shown, showView pulls its outside thread from the public API (fetchThread
// on the root, xrd/xr) — the same path network posts use; each fetched post is added
// as a real entry keyed by its own rkey with { external:true, did, handle, t, d, f?,
// p? } so it slots straight into the reply tree.
// Quoted tweets are real entries keyed "x:<rkey>" with { tweet:true, u, t, a }.
let INDEX = {};
let META = {};         // account profile: {name, desc, avatar?}
// Owner DID + archive URL from a single source: the <link rel="archive"> the Dockerfile
// substituted at build time. Filename is the part after "did:plc:" (no colons in the URL),
// so one tag carries both pieces.
const ARCHIVE_HREF = document.querySelector('link[rel="archive"]').getAttribute("href");
const ARCHIVE_DID = "did:plc:" + ARCHIVE_HREF.slice(0, -5);
let DID = ARCHIVE_DID;
let PINS = [];         // pinned thread roots shown together (ctrl+click merges threads)
// lastPinsKey gates the fast path: a click within the same pinned set skips relayout —
// view.refresh() recomputes the selection classes, view.panIntoView() pans. The forest
// view owns the rest of the render cache (positions, bounds, camera, the node/edge DOM).
let lastPinsKey = null;
let lastShown = null;  // hash we last restored, to dedupe popstate/hashchange/our own writes
let currentView = null;   // last built view + per-key render metadata, read by renderNode
const children = {};   // rkey -> [child rkeys]   (local replies)
const quotedBy = {};   // rkey -> [quoting rkeys] (local quotes pointing in)
const COLLAPSED = new Set();   // rkeys whose reply subtree the user has folded shut (downward)
const UPCOLLAPSED = new Set(); // rkeys folded upward: their thread is re-rooted here, hiding everything above
const APPVIEW = "https://public.api.bsky.app/xrpc";

let FOCUS = null;

// NODE_W (box width) comes from layout.js; post padding/spacing live in the .post CSS,
// since the browser now lays out and measures the card.

const $ = (s) => document.querySelector(s);
const setStatus = (m) => { $("#status").textContent = m; };
const svg = $("#graph");

// The forest view owns the scene DOM, measurement, packing, the reconcile, the two motion
// timelines (one-shot reflow + rippled presence), the camera, and pointer interaction — all
// formerly inline here. We hand it a forest description plus, per key, finished card content
// and a class string; it draws and animates. renderNode / edgeClass / onActivate / onFold
// (hoisted, defined below) are the only place thread vocabulary meets the library.
// Layout mode: layered (depth = aligned rows, top-anchored, clade-style) vs variable-height
// (each reply a gap below its parent's actual bottom, thread-style). Temporarily ON to view
// the thread data layered; flip to false to return to thread mode.
const LAYERED = false;
const view = new FlexForest(svg, {
	config: {nodeW: NODE_W, ...GAPS, layered: LAYERED},
	renderNode, nodeClass, edgeClass, onActivate, onFold,
});

// ---------- data loading ----------
// True when the entry URL names only network posts (each a "did/rkey" token, or a pasted
// at:// / bsky.app URL). Such a view renders entirely from the API, so there's no reason to
// pull the local archive at all.
function bootIsExternal() {
	const raw = decodeURIComponent(location.hash.slice(1));
	if (!raw) return false;
	const pasted = normalizeRef(raw);
	if (pasted) { const r = parseRef(pasted); return r.did !== ARCHIVE_DID; }
	const [focus, rootsStr = ""] = raw.split(";");
	const tokens = [focus, ...rootsStr.split(",").filter(Boolean)];
	// External only when every named token is a non-owner DID; a bare rkey or an owner-DID
	// token means the archive is needed.
	return tokens.length > 0 && tokens.every(t => { const r = parseRef(t); return r.did && r.did !== ARCHIVE_DID; });
}

async function load() {
	// The archive is the owner's home base: it fills INDEX (sidebar + search) and stamps
	// each entry with the owner identity. A bootup link that names only non-owner posts
	// skips the fetch — no point pulling MB to render someone else's thread.
	let data = null;
	if (!bootIsExternal()) {
		setStatus("Loading…");
		const r = await fetch(ARCHIVE_HREF);
		if (r.ok) data = await r.json();
	}
	INDEX = data ? data.posts : {};
	META = data ? data.meta : {};
	// The archive is one repo, so every post in it is by the owner. Stamp the owner's
	// identity (the same fields a fetched post carries) onto each, so nothing downstream
	// special-cases archive vs API — the cache is just a prefill of the universal shape.
	const ownerAvatar = META.avatar ? `https://cdn.bsky.app/img/avatar_thumbnail/plain/${DID}/${META.avatar}@jpeg` : "";
	for (const rk in INDEX) {
		const e = INDEX[rk];
		if (e.tweet) continue;
		e.did = DID; e.name = META.name || ""; e.desc = META.desc || ""; e.avatar = ownerAvatar;
		// X-host link card → synthetic tweet-quote node; facet rules (post-link → quote,
		// X-host link → strip) applied symmetrically with the network path below.
		if (e.ext && e.ext.u) {
			const tid = tweetQuoteAt(rk, e.ext.u, e.ext.t, e.ext.d);
			if (tid) { (e.q || (e.q = [])).push(tid); delete e.ext; }
		}
		promoteFacetQuotes(rk, e);
	}
	populateHeader();
	buildGraph();
	// Hand the layout engine the live model (same refs we keep mutating via fetches).
	initLayout({INDEX, children, quotedBy, COLLAPSED, UPCOLLAPSED});
	buildSidebar();
	const dates = Object.values(INDEX).map(e => e.d).filter(Boolean);
	const latest = dates.length ? dates.reduce((a, b) => a > b ? a : b).slice(0, 10) : "";
	$("#status").innerHTML = data ? `${Object.keys(INDEX).length} posts loaded.` + (latest ? `<br>Up to ${latest}` : "")
		: bootIsExternal() ? "" : "No archive — paste a post URL above.";
	FOCUS = null; PINS = []; lastPinsKey = null;   // force the first navigate to fully render (and replace, not push)
	showHash(true);                                // restore a shared/bookmarked (possibly merged) view, fetching outside threads it names
}

function buildGraph() {
	for (const rkey in INDEX) { children[rkey] = []; quotedBy[rkey] = []; }
	for (const rkey in INDEX) {
		const e = INDEX[rkey];
		if (e.p && INDEX[e.p]) children[e.p].push(rkey);
		for (const q of e.q || []) if (INDEX[q]) quotedBy[q].push(rkey);
	}
	const byDate = (a, b) => (INDEX[a].d || "").localeCompare(INDEX[b].d || "");
	for (const k in children) children[k].sort(byDate);
	for (const k in quotedBy) quotedBy[k].sort(byDate);
}

// The root of the graph a click on this post would open: its local thread root,
// or — when that root is a reply into an outside thread — that outside root (xr).
// Posts that land on the same assembled graph share this key.
function graphRoot(rkey) {
	const r = localRoot(rkey);
	return INDEX[r].xr || r;
}

function topThreads() {
	const score = (r) => descendantCount(r) + quotedBy[r].length;
	return Object.keys(INDEX)
		.filter(r => isLocalRoot(r) && !isNoise(r) && !INDEX[r].tweet && INDEX[r].did === DID)
		.map(r => ({rkey: r, s: score(r), d: INDEX[r].d || ""}))
		.filter(x => x.s > 0)
		.sort((a, b) => (b.s - a.s) || b.d.localeCompare(a.d));
}

// A sidebar row: a <li> with the date in <small>, then the snippet text.
// Clicking centers `goto`; `mark` (lowercased query) highlights the match.
function sidebarItem(rk, goto, metaText, mark) {
	const li = document.createElement("li");
	// The graph this row opens (see graphRoot): drives clustering, the hover box,
	// and the active highlight, so a row lights up whenever its graph is pinned.
	const g = graphRoot(rk);
	li.dataset.group = g;
	if (PINS.includes(g)) li.className = "active";
	li.onclick = () => navigate(goto);
	const meta = document.createElement("small");
	meta.textContent = metaText;
	li.append(meta);
	const t = INDEX[rk].t || "(no text)";
	const i = mark ? t.toLowerCase().indexOf(mark) : -1;
	if (i < 0) {
		li.append(t.slice(0, 110));
	} else {                                    // show the match in context, highlighted
		const start = Math.max(0, i - 28);
		li.append(start ? "…" + t.slice(start, i) : t.slice(0, i));
		const m = document.createElement("mark");
		m.textContent = t.slice(i, i + mark.length);
		li.append(m);
		const end = i + mark.length + 80;
		li.append(t.slice(i + mark.length, end) + (end < t.length ? "…" : ""));
	}
	return li;
}

// Fill the header with the account: avatar, display name (linked to bsky.app),
// and the profile description.
function populateHeader() {
	const m = META;
	// Display name links to the profile via DID (handles aren't recorded in the
	// archive, but bsky.app/profile/<did> resolves fine). All optional — in API-only
	// mode (no archive) the profile is empty and the header just stays bare.
	if (m.name) {
		const lk = document.createElement("a");
		lk.href = `https://bsky.app/profile/${DID}`;
		lk.textContent = m.name;
		$("#acctName").append(lk);
	}
	if (m.desc) $("#acctDesc").textContent = m.desc;
	if (m.avatar) {                        // optional — the <img> starts hidden
		const av = $("#avatar");
		av.src = `https://cdn.bsky.app/img/avatar_thumbnail/plain/${DID}/${m.avatar}@jpeg`;
		av.hidden = false;
	}
	document.title = m.name ? m.name + " — Thread Browser" : "Thread Browser";
}

// The top-left identity follows the focused (white-anchor) author: avatar, name (linked
// to their profile), and @handle beneath. The handle rides along with every fetched post,
// so no profile call; the archive owner (whose handle we don't store) shows its
// description instead. Runs on every focus change, full render or fast-path refocus.
function updateHeader(rk) {
	const e = INDEX[rk];
	if (!e) return;
	document.body.classList.toggle("offsite", e.did !== DID);   // off-site = not the archive owner → hide the archive-only sidebar
	const a = authorOf(rk);
	const avEl = $("#avatar");
	if (a.avatar) { avEl.src = a.avatar; avEl.hidden = false; } else avEl.hidden = true;
	const acct = $("#acctName");
	acct.textContent = "";
	if (a.name && a.url) { const link = document.createElement("a"); link.href = a.url; link.textContent = a.name; acct.append(link); }
	$("#acctDesc").textContent = a.desc || (a.handle ? "@" + a.handle : "");
}

function heading(text) {
	const h = document.createElement("h3");
	h.textContent = text;
	return h;
}

function buildSidebar() {
	const sb = $("#sidebar");
	sb.innerHTML = "";
	kinGroup = null;                            // the boxed group is gone with the old rows
	const q = $("#q").value.trim().toLowerCase();
	const ul = document.createElement("ul");
	const kinbox = document.createElement("div");   // hover box drawn over a same-tree run
	kinbox.id = "kinbox";
	ul.append(kinbox);                          // positioned, so it paints over the rows

	if (q) {                                    // search: list the matching posts themselves
		const hits = [];
		for (const rk in INDEX)
			if (!INDEX[rk].tweet && INDEX[rk].did === DID && searchText(INDEX[rk]).includes(q)) hits.push(rk);
		// Cluster by the graph each hit belongs to (so same-tree results are
		// adjacent and boxable), ordering trees by their most recent hit and rows
		// within a tree newest-first.
		const newest = {};
		for (const rk of hits) {
			const g = graphRoot(rk), d = INDEX[rk].d || "";
			if (!newest[g] || d > newest[g]) newest[g] = d;
		}
		hits.sort((a, b) => {
			const ga = graphRoot(a), gb = graphRoot(b);
			if (ga !== gb) return newest[gb].localeCompare(newest[ga]) || (ga < gb ? -1 : 1);
			return (INDEX[b].d || "").localeCompare(INDEX[a].d || "");
		});
		sb.append(heading(`${hits.length} post${hits.length === 1 ? "" : "s"} match “${q}”`), ul);
		for (const rk of hits.slice(0, 300))
			ul.append(sidebarItem(rk, rk, (INDEX[rk].d || "").slice(0, 10), q));
		return;
	}

	const ranked = topThreads();
	sb.append(heading(`Top threads (${ranked.length})`), ul);
	for (const {rkey, s} of ranked.slice(0, 250))
		ul.append(sidebarItem(rkey, rkey, (INDEX[rkey].d || "").slice(0, 10) + ` · ${s} ↳`, null));
}

// ---------- text helpers ----------
// Everything a search should match for a post, lowercased: its text, image alt
// text, and any link URLs (richtext facets + external card).
function searchText(e) {
	let s = e.t || "";
	if (e.img) for (const im of e.img) if (im.a) s += " " + im.a;
	if (e.vid && e.vid.a) s += " " + e.vid.a;
	if (e.ext && e.ext.u) s += " " + e.ext.u;
	if (e.f) for (const f of e.f) for (const feat of f.features) if (feat.uri) s += " " + feat.uri;
	return s.toLowerCase();
}

// ---------- post content (HTML) ----------
// A post is an HTML card inside a <foreignObject>: the browser wraps the text, lays
// out the images/card/video, and we measure the height for the tidy-tree packing.
const esc = (s) => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const domain = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
// "3:14pm" (local) from an ISO timestamp; "" if unparseable.
const timeStr = (iso) => {
	const dt = new Date(iso);
	if (isNaN(dt)) return "";
	const h = dt.getHours();
	return `${h % 12 || 12}:${String(dt.getMinutes()).padStart(2, "0")}${h < 12 ? "am" : "pm"}`;
};

// Post body as HTML, styling the byte-offset facets (links / mentions / tags) inline.
function bodyHTML(e) {
	const txt = e.t || "";
	if (!txt.trim()) {
		if (e.ext && e.ext.u || e.img || e.vid) return "";   // the media carries it
		return `<span class="dim">(no text)</span>`;
	}
	if (!e.f || !e.f.length) return esc(txt);
	const enc = new TextEncoder(), dec = new TextDecoder(), bytes = enc.encode(txt);
	const facets = [...e.f].sort((a, b) => a.index.byteStart - b.index.byteStart);
	let out = "", cursor = 0;
	for (const f of facets) {
		const start = f.index.byteStart, end = f.index.byteEnd;
		if (start < cursor) continue;
		if (start > cursor) out += esc(dec.decode(bytes.slice(cursor, start)));
		const inner = esc(dec.decode(bytes.slice(start, end))), feat = f.features[0];
		if (feat.$type === "app.bsky.richtext.facet#link") out += `<a class="lnk" href="${esc(feat.uri)}" title="${esc(feat.uri)}">${inner}</a>`;
		else if (feat.$type === "app.bsky.richtext.facet#mention") out += `<a class="men" href="https://bsky.app/profile/${esc(feat.did)}">${inner}</a>`;
		else if (feat.$type === "app.bsky.richtext.facet#tag") out += `<span class="tag">${inner}</span>`;
		else out += inner;
		cursor = end;
	}
	if (cursor < bytes.length) out += esc(dec.decode(bytes.slice(cursor)));
	return out;
}

// Author identity for any post — archive or fetched — in one place. Archive posts are
// stamped with the owner's identity at load, so this never branches on source. A tweet
// has only its embedded author name and an outbound X link.
function authorOf(rk) {
	const e = INDEX[rk] || {};
	if (e.tweet) return {name: e.a || "post", url: e.u, avatar: "", tweet: true};
	return {did: e.did || "", name: e.name || ("@" + (e.handle || "")), handle: e.handle || "",
		desc: e.desc || "", avatar: e.avatar || "", url: e.did ? `https://bsky.app/profile/${e.did}` : ""};
}

// Full post content (header + body + images + link card + video + tweet chip) as HTML.
function postHTML(rkey, badge) {
	const e = INDEX[rkey];
	const a = authorOf(rkey);
	const dstr = (e.d || "").slice(0, 10);
	let h = "<header>";
	if (a.avatar) h += `<img class="avatar" src="${esc(a.avatar)}" alt="">`;
	// the name links to the author's profile (a tweet links out to X)
	if (badge) h += a.url ? `<a class="badge" href="${esc(a.url)}">${esc(badge)}</a>` : `<span class="badge">${esc(badge)}</span>`;
	const when = dstr + (timeStr(e.d) ? " · " + timeStr(e.d) : "");
	if (dstr && !e.tweet) h += `<a class="date" href="https://bsky.app/profile/${a.did}/post/${rkey}">${when}</a>`;
	else if (dstr) h += `<span class="date">${when}</span>`;
	h += `</header><div class="body">${bodyHTML(e)}</div>`;
	if (e.img) for (const im of e.img) {
		const ar = im.ar ? ` style="aspect-ratio:${im.ar[0]}/${im.ar[1]};height:auto"` : "";   // size the box to the image
		h += `<img class="media"${ar} src="${esc(im.u)}"${im.a ? ` alt="${esc(im.a)}" title="${esc(im.a)}"` : ""}>`;
	}
	if (e.ext && e.ext.u && !e.tweet) {
		const t = (e.ext.t || "").trim(), d = (e.ext.d || "").trim();
		h += `<a class="card" href="${esc(e.ext.u)}" title="${esc(e.ext.u)}">`;
		if (e.ext.thumb) h += `<img class="cardthumb" src="${esc(e.ext.thumb)}" alt="">`;
		h += `<span class="cardtext">${t ? `<b>${esc(t)}</b>` : ""}${d ? `<i>${esc(d)}</i>` : ""}<small>${esc(domain(e.ext.u))}</small></span></a>`;
	}
	if (e.vid) {
		const ar = e.vid.ar ? ` style="aspect-ratio:${e.vid.ar[0]}/${e.vid.ar[1]}"` : "";   // size the box like images; 16/9 fallback in CSS
		const alt = e.vid.a ? ` aria-label="${esc(e.vid.a)}" title="${esc(e.vid.a)}"` : "";   // alt for the poster; gone once it plays
		const poster = e.poster ? ` poster="${esc(e.poster)}"` : "";
		h += `<video class="media"${ar}${alt}${poster} controls preload="none" src="${esc(e.playlist || "")}"></video>`;
	}
	if (e.tweet && e.u) h += `<a class="clink" href="${esc(e.u)}">↗ ${esc(domain(e.u))}</a>`;
	// One footer row. The reply glyph is an action link to bsky.app (its post page puts the
	// reply composer one click away — bsky has no documented reply-intent URL), so it appears
	// on every bsky post regardless of source. Repost/like are count-only, shown when the
	// post came from the API. The count number itself is hidden when zero.
	const copyText = e.tweet ? (e.a || "") : (e.t || "");
	const bits = [];
	if (e.did && !e.tweet) bits.push(`<a class="reply" title="Reply" href="https://bsky.app/profile/${esc(e.did)}/post/${rkey}"><svg viewBox="0 0 24 24"><use href="#reply-icon"/></svg>${fmtCount(e.rc || 0)}</a>`);
	if (typeof e.rc === "number") {
		bits.push(`<span title="Reposts"><svg viewBox="0 0 24 24"><use href="#repost-icon"/></svg>${fmtCount(e.rp || 0)}</span>`);
		bits.push(`<span title="Likes"><svg viewBox="0 0 24 24"><use href="#like-icon"/></svg>${fmtCount(e.lk || 0)}</span>`);
	}
	if (copyText) bits.push(`<button class="copy" type="button" data-copy="${esc(copyText)}" aria-label="Copy post text" title="Copy post text"><svg viewBox="0 0 24 24"><use href="#copy-icon"/></svg></button>`);
	if (bits.length) h += `<footer>${bits.join("")}</footer>`;
	return h;
}

// k/M abbreviation matches the bsky.app post controls; 0 renders as the glyph alone.
const fmtCount = (n) => !n ? ""
	: n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"
	: n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k"
	: String(n);

// Measurement and SVG node/edge drawing moved into flexforest-view; the page only supplies
// each card's finished content (postHTML) and a class string via renderNode.

// Who wrote a post: a fetched post carries its author DID; an archive post is the
// account whose repo we loaded (DID). Used to colour posts by author, not by account.
const authorDid = (rk) => INDEX[rk] && INDEX[rk].did;

// ---------- app <-> library callbacks ----------
// The only place post/quote/thread vocabulary meets flexforest-view. They read currentView
// (set by render) plus the live model and FOCUS/PINS/search — no DOM, no geometry.

// A node's class string from its kind + the current selection/search state. The library
// prepends "node " and recomputes this on every render and on view.refresh() — so the old
// markFocal/markSearchHits/setFocusNode passes are gone; the cascade reads these classes.
function nodeClass(rk) {
	const e = INDEX[rk], m = currentView.meta[rk];
	let cls;
	if (m.sidecar) {
		const rel = e.tweet ? "" : (m.dir === "out" ? " qout" : " qin");
		cls = "quote" + rel + (e.tweet ? " tweet" : "");
	} else {
		cls = e.tweet ? "tweet" : "au";                                       // every authored tree post is tinted
		if (rk === FOCUS) cls += " focus";
		if (PINS.length > 1 && PINS.includes(rk)) cls += " root";
		if (!e.tweet && authorDid(rk) === authorDid(FOCUS)) cls += " focal";  // whiten the focused author's posts
	}
	const q = $("#q").value.trim().toLowerCase();
	if (q && searchText(e).includes(q)) cls += " hit";
	return cls;
}

// Everything the view needs to draw + measure one node: finished card content, its wrapper
// class (so the measurer styles it identically), the node class, a content cache key, the
// double-box flag (a grafted quote-reply shortcut), and the fold-tag labels.
function renderNode(rk) {
	const e = INDEX[rk], m = currentView.meta[rk];
	let downFold, upFold;
	if (!m.sidecar && !m.graft) {
		if (children[rk].length) downFold = COLLAPSED.has(rk) ? String(descendantCount(rk)) : "–";
		if (e.p && INDEX[e.p]) upFold = UPCOLLAPSED.has(rk) ? String(descendantCount(localRoot(rk)) - descendantCount(rk)) : "–";
	}
	return {content: postHTML(rk, m.badge), wrapClass: "post", className: nodeClass(rk),
		contentKey: `${rk} ${m.badge}`, dbl: m.graft, downFold, upFold};
}

// Edge class by kind: a structural edge into a grafted quote-reply is solid amber; quote
// cross-links and sidecar links are dashed amber with an arrowhead; replies are plain.
function edgeClass({to, kind}) {
	return kind === "child" ? (currentView.meta[to] && currentView.meta[to].graft ? "edge graft" : "edge")
		: "edge quoteedge";
}

// A node was tapped (ev is {longPress:true} from a touch hold). The copy button and in-card
// links act on their own; a tweet only links out; a modified tap merges/un-merges the thread.
function onActivate(rk, ev) {
	if (ev.longPress) { toggleThread(rk); return; }                    // touch equivalent of ctrl/shift-click
	const copy = ev.target.closest(".copy");
	if (copy) { ev.stopPropagation(); navigator.clipboard.writeText(copy.dataset.copy); return; }
	if (ev.target.closest("a")) return;                                // a real link inside the card — let it navigate
	ev.stopPropagation();
	if (INDEX[rk].tweet) return;                                       // a tweet only links out; the node itself does nothing
	if (ev.ctrlKey || ev.metaKey || ev.shiftKey) toggleThread(rk);     // merge / un-merge this post's thread
	else navigate(rk);
}

// A fold tag was clicked. Down folds the reply subtree (fade it out, THEN close the gap —
// collapseFirst); up re-roots the thread here, hiding parent, siblings, and everything above.
function onFold(rk, dir) {
	if (dir === "down") {
		const folding = !COLLAPSED.has(rk);
		folding ? COLLAPSED.add(rk) : COLLAPSED.delete(rk);
		pruneCollapsed();                       // a new fold may subsume folds beneath it
		writeState(false);                      // the fold is part of the view — record it in the hash
		lastPinsKey = null;
		render(FOCUS, rk, folding);             // wave radiates from the toggled node; fade-then-reflow when folding shut
	} else {
		const up = UPCOLLAPSED.has(rk);
		up ? UPCOLLAPSED.delete(rk) : UPCOLLAPSED.add(rk);
		if (!up && !isAncestor(rk, FOCUS) && FOCUS !== rk) FOCUS = rk;   // re-rooting hid the focus → pull it down to rk
		pruneCollapsed();
		writeState(false);
		lastPinsKey = null;
		render(FOCUS, rk);
	}
}

const pinsKey = () => PINS.join("|");

// The hash is the single source of truth for the whole view (everything but zoom):
// "<focus>;<pinnedRoots>;<collapsed>", three comma-lists separated by ";". Focus
// already implies its own thread root, so that's dropped from the pinned list; the
// other two lists are sorted, so a given view always yields one canonical hash (and
// one hash always rebuilds the same view). Trailing empty sections are omitted, so a
// lone thread is just "<focus>".
// The session remembers every fold the user has set. pruneCollapsed drops only the ones
// they can no longer reach — node gone, or thread no longer pinned — NOT the ones merely
// hidden under a higher fold. That's the fix for "collapse X (which hid a collapsed Y),
// expand X, and Y is forgotten": Y stays in the set while hidden, so re-expanding X
// restores it. Canonicity is enforced at the hash instead — see effectiveFolds.
function pruneCollapsed() {
	for (const rk of [...COLLAPSED]) if (!INDEX[rk] || !PINS.includes(localRoot(rk))) COLLAPSED.delete(rk);
	for (const rk of [...UPCOLLAPSED]) if (!INDEX[rk] || !PINS.includes(localRoot(rk))) UPCOLLAPSED.delete(rk);
}

// The folds that actually SHAPE the visible graph — the canonical subset the hash carries,
// so one view always yields one hash. Dropped here (but kept in the session set): a down-fold
// hidden under a higher one, a down-fold outside a re-rooted subtree, and an up-fold made
// redundant by a deeper up-fold below it. Pure; mutates nothing.
function effectiveFolds() {
	const up = [...UPCOLLAPSED].filter(rk =>
		![...UPCOLLAPSED].some(o => o !== rk && isAncestor(rk, o)));   // a deeper up-fold already hides everything above rk
	const collapsed = [...COLLAPSED].filter(rk => {
		for (let p = INDEX[rk].p; p && INDEX[p]; p = INDEX[p].p) if (COLLAPSED.has(p)) return false;   // hidden under a higher down-fold
		const ups = [...UPCOLLAPSED].filter(u => localRoot(u) === localRoot(rk));
		if (ups.length && !ups.some(u => u === rk || isAncestor(u, rk))) return false;                // outside the re-rooted subtree
		return true;
	});
	return {collapsed, up};
}

// "<focus>;<pinnedRoots>;<down-collapsed>;<up-collapsed>" — four comma-lists. Down
// folds hide a subtree; up folds re-root a thread. All lists sorted so the view is
// canonical both ways; trailing empty sections are trimmed.
function hashFor(focus, pins) {
	const fr = localRoot(focus);
	const roots = pins.filter(p => p !== fr).map(refOf).sort();
	const {collapsed, up} = effectiveFolds();   // canonical visible subset; the session set may remember more
	return [refOf(focus), roots.join(","), collapsed.map(refOf).sort().join(","), up.map(refOf).sort().join(",")]
		.join(";").replace(/;+$/, "");
}

// lastShown tracks the hash we last acted on, so the popstate+hashchange pair a
// single history move fires (and our own writes) don't re-trigger a restore.
function writeHash(focus, pins, replace) {
	const hash = "#" + hashFor(focus, pins);
	if (replace) history.replaceState(null, "", hash);
	else history.pushState(null, "", hash);
	lastShown = location.hash;
	syncURL();
}
// The header URL field is a window into the hash: it shows the current view's hash
// and editing it loads that thread (a pasted post URL is normalised to a token first).
const syncURL = () => { $("#url").value = decodeURIComponent(location.hash.slice(1)); };
// Write the live view (focus + pins + both fold sets) — used by the fold toggles.
const writeState = (replace) => writeHash(FOCUS, PINS, replace);

function parseHash() {
	const raw = decodeURIComponent(location.hash.slice(1));
	if (!raw) return null;
	// A pasted at:// URI or bsky.app post URL is a one-post network view.
	const pasted = normalizeRef(raw);
	if (pasted) return {focus: pasted, roots: [], collapsed: [], up: []};
	const [focus, rootsStr = "", colStr = "", upStr = ""] = raw.split(";");
	// A local focus must be held; a network focus ("did/rkey") is fetched by showView.
	if (!focus || (!parseRef(focus).did && !INDEX[focus])) return null;
	return {focus, roots: rootsStr.split(",").filter(Boolean),
		collapsed: colStr.split(",").filter(Boolean), up: upStr.split(",").filter(Boolean)};
}

// The one way a view is shown. A view is a focus post plus a set of pinned
// roots; navigate, merge, and hash-restore all funnel through here with a
// different root set. We first fetch any outside thread the roots name (so the
// connecting posts exist), then resolve each root to a concrete local root we
// hold, pin them, and draw — once. The hash is the source of truth, so shared
// URLs and Back/Forward replay the exact (possibly merged) view.
// Monotonic token so paints from a stale showView (whose fetches resolved AFTER a newer
// showView started) skip themselves instead of churning state behind the current view.
let showViewToken = 0;
async function showView(focus, roots, push, collapsed, up) {
	const myToken = ++showViewToken;
	const replace = !push || FOCUS === null;        // captured before any await
	// focus/roots arrive as tokens: a bare rkey (local archive) or "did/rkey" (a post
	// from anywhere on the network). Network posts we don't hold yet get their whole
	// thread pulled — both directions — before we pin anything.
	const fRef = parseRef(focus), rootRefs = roots.map(parseRef);
	// One fetch path. A referenced post's thread is pulled from the API (fetchThread,
	// FETCHED-deduped) when we don't already hold it: a "did/rkey" token from the hash/
	// URL, an external stub already in INDEX that the user clicked to expand, or one of
	// our own posts that replied into an outside thread (pull that outside thread —
	// preferring its root, so every sibling of ours under it comes back too).
	const uriFor = (did, rk) => `at://${did}/app.bsky.feed.post/${rk}`;
	const toFetch = [], want = (did, rk) => { if (did && !FETCHED.has(uriFor(did, rk))) toFetch.push({did, rkey: rk}); };
	for (const r of [fRef, ...rootRefs]) {
		const e = INDEX[r.rkey];
		if (r.did) want(r.did, r.rkey);                              // "did/rkey" token from the hash → fetch that did
		else if (e && e.xp) want(e.xrd || DID, e.xr || r.rkey);      // our post that replied outward → fetch the external root (siblings come with it)
		else if (e && e.did) want(e.did, r.rkey);                    // any other held post (ours or someone else's) → pull its live thread to catch new replies/quotes with their counts
	}
	const focusRk = fRef.rkey;
	// A hash restore carries both fold sets; force a real relayout, since a fold set —
	// not PINS — may be what changed.
	if (collapsed) lastPinsKey = null;
	// Resolve roots to local roots from whatever's in INDEX *right now* and draw. Called
	// once up front (instant, from cache) and again as each fetch lands, so a merged or
	// shared view fills in thread-by-thread instead of waiting for every request.
	const paint = () => {
		if (myToken !== showViewToken) return;       // a newer showView started; this paint is stale
		if (!INDEX[focusRk]) return;                 // focus not loaded yet — a later fetch will paint it
		// A restored fold names posts that may only arrive by fetch, so re-apply both sets
		// from what's in INDEX on every paint (same as pins below), not once up front.
		if (collapsed) {
			COLLAPSED.clear();
			for (const t of collapsed) { const rk = parseRef(t).rkey; if (INDEX[rk]) COLLAPSED.add(rk); }
			UPCOLLAPSED.clear();
			for (const t of up || []) { const rk = parseRef(t).rkey; if (INDEX[rk]) UPCOLLAPSED.add(rk); }
		}
		const pins = [], seen = new Set();
		const add = (rk) => { if (rk && !seen.has(rk)) { seen.add(rk); pins.push(rk); } };
		for (const r of rootRefs) if (INDEX[r.rkey]) add(localRoot(r.rkey));
		add(localRoot(focusRk));
		pins.sort();                                 // canonical: same threads always lay out + hash the same
		FOCUS = focusRk; PINS = pins;
		pruneCollapsed();
		return render(focusRk);                      // the view's settle promise, so we can await the build below
	};
	// Cached focus → paint from cache immediately, fetch in the background, and after the
	// in-flight stagger drains, paint again to fold in any newly-arrived replies/quotes.
	// Network-only focus has no cache to draw from, so we await the fetch before painting.
	if (INDEX[focusRk]) {
		const first = paint();
		if (myToken === showViewToken) writeHash(focusRk, PINS, replace);
		if (toFetch.length) {
			await Promise.all(toFetch.map(fetchThread));
			await first;                                 // let the first build's animation settle before folding in fetched posts
			if (myToken === showViewToken) { lastPinsKey = null; paint(); }
		}
	} else {
		setStatus("Loading thread…");
		await Promise.all(toFetch.map(fetchThread));
		setStatus("");
		paint();
		if (myToken === showViewToken && INDEX[focusRk]) writeHash(focusRk, PINS, replace);
	}
}

// Normal click: focus a post. If its thread is already on screen, keep the
// current (possibly merged) view and just refocus; otherwise jump to it alone.
function navigate(focus) {
	if (!INDEX[focus]) return;
	const root = localRoot(focus);
	const roots = PINS.includes(root) ? PINS : [root];
	if (focus === FOCUS && roots.join("|") === pinsKey()) return;
	showView(focus, roots, true);
}

// Ctrl/Cmd+click: toggle a thread in the merged view. An off-tree quote adds its
// thread; a node already on screen removes its thread (unless it's the last one,
// moving focus to a survivor if it was in the removed one).
function toggleThread(rkey) {
	if (!INDEX[rkey] || INDEX[rkey].tweet) return;   // tweets have no thread
	const root = localRoot(rkey);
	if (!PINS.includes(root)) { showView(rkey, [...PINS, root], true); return; }
	if (PINS.length === 1) return;                   // can't drop the last thread
	const pins = PINS.filter(p => p !== root);
	showView(localRoot(FOCUS) === root ? pins[0] : FOCUS, pins, true);
}

function render(focus, anchorOverride = null, collapseFirst = false) {
	const prevFocus = FOCUS;             // captured before we overwrite, so the view can anchor against it
	FOCUS = focus;
	updateHeader(focus);                 // top-left reflects the focused author (both paths)
	$("#hint").style.display = "none";

	// keep the sidebar's active highlight in sync as the pinned set changes (the list isn't
	// rebuilt on navigation): a row is active when its graph is pinned.
	document.querySelectorAll("#sidebar li[data-group]").forEach(it =>
		it.classList.toggle("active", PINS.includes(it.dataset.group)));

	// Same pinned set already on screen → no relayout; just recompute the selection classes
	// (refresh re-runs renderNode) and pan the new post into view if it's off-screen.
	if (pinsKey() === lastPinsKey && view.getElement(focus)) {
		view.refresh();
		view.panIntoView(focus);
		return Promise.resolve();
	}

	// Build the visible subgraph and the per-key metadata renderNode reads (badge, kind,
	// graft, sidecar direction). The view measures + packs from the description below.
	const v = buildVisible(PINS, focus);
	const meta = {};
	for (const rk of v.tree) {
		const e = INDEX[rk];
		meta[rk] = {sidecar: false, graft: v.grafts.has(rk),
			badge: v.grafts.has(rk) && !e.tweet ? "↪ quoted"
				: e.tweet ? "𝕏 " + (e.a || "post")
				: authorOf(rk).name.slice(0, 24)};
	}
	for (const s of v.satNodes) {
		const e = INDEX[s.rkey];
		meta[s.rkey] = {sidecar: true, dir: s.dir, graft: false,
			badge: e.tweet ? "𝕏 " + (e.a || "post") : authorOf(s.rkey).name.slice(0, 16)};
	}
	currentView = {view: v, meta};

	// Hand the view the neutral description (quotes → sidecars + cross-links), the wave
	// origin, the anchor candidates (a survivor held still across the relayout, first that
	// exists wins), and the collapse choreography flag. anchorOverride is the toggled fold.
	lastPinsKey = pinsKey();
	return view.update({
		nodes: v.tree,
		children: v.treeKids,
		roots: v.displayRoots,
		crossEdges: v.quoteEdges,
		sidecars: v.satNodes.map(s => ({key: s.rkey, anchor: s.anchor, side: s.dir === "in" ? "left" : "right"})),
		sidecarEdges: v.satEdges.map(e => ({anchor: e.anchor, key: e.sat, side: e.dir === "in" ? "left" : "right"})),
		origin: anchorOverride || focus,
		anchorKeys: [anchorOverride, prevFocus, focus].filter(Boolean),
		collapseFirst,
	});
}

// (Layers, reconcile, the stagger/leave waves, finalize, and the camera all live in
// flexforest-view now. render() above hands the view a description; the view does the rest.)

const rkeyOf = (uri) => uri.split("/").pop();

// A node's hash token: bare rkey for the local archive, "did/rkey" for a post from
// elsewhere on the network (rkeys aren't globally unique and can't be resolved to a
// DID, so the DID must travel in the hash to be re-fetchable).
const refOf = (rk) => { const did = INDEX[rk] && INDEX[rk].did; return did && did !== DID ? `${did}/${rk}` : rk; };
// Inverse: split a token into {did, rkey}. did === null means "look in the local repo".
const parseRef = (tok) => { const i = tok.indexOf("/"); return i < 0 ? {did: null, rkey: tok} : {did: tok.slice(0, i), rkey: tok.slice(i + 1)}; };
// Turn a pasted at:// URI or bsky.app post URL into an "authority/rkey" focus token
// (authority may be a handle — the AppView resolves it and we keep the real DID).
function normalizeRef(raw) {
	let m = raw.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/?#]+)/)
		|| raw.match(/bsky\.app\/profile\/([^/]+)\/post\/([^/?#]+)/);
	return m ? `${m[1]}/${m[2]}` : null;
}

// FETCHED guards thread pulls (keyed by at-uri) so each is fetched once.
const FETCHED = new Set();
// Pull a whole thread for a post anywhere on the network in ONE getPostThread call —
// ancestors via .parent (backward) and replies via .replies (forward) — and inject
// every post we don't already hold. authority may be a DID or a handle.
async function fetchThread(ref) {
	const uri = `at://${ref.did}/app.bsky.feed.post/${ref.rkey}`;
	if (FETCHED.has(uri)) return;
	FETCHED.add(uri);
	let thread;
	try {
		const resp = await fetch(`${APPVIEW}/app.bsky.feed.getPostThread`
			+ `?uri=${encodeURIComponent(uri)}&depth=20&parentHeight=80`);
		if (!resp.ok) { if (resp.status === 429) setStatus("Rate-limited by Bluesky — slow down a moment."); return; }
		thread = (await resp.json()).thread;
	} catch (err) { console.warn("fetchThread failed", uri, err); return; }
	if (!thread || !thread.post) return;
	const addNode = (post) => INDEX[rkeyOf(post.uri)] ? rkeyOf(post.uri) : injectExternal(post);
	const focusRk = addNode(thread.post);
	for (let n = thread.parent, child = focusRk; n && n.post && n.post.uri; n = n.parent) {
		const rk = addNode(n.post); linkReply(rk, child); child = rk;            // backward
	}
	(function down(n) {                                                          // forward
		const prk = addNode(n.post);
		for (const r of n.replies || []) if (r && r.post && r.post.uri) { linkReply(prk, addNode(r.post)); down(r); }
	})(thread);
}

// Add a fetched outside post to INDEX as a real (external) node, if we don't
// already hold it. Our own posts stay untouched.
function injectExternal(post) {
	const rk = rkeyOf(post.uri);
	if (INDEX[rk]) return rk;
	INDEX[rk] = {
		did: post.author.did,
		handle: post.author.handle || "",
		name: post.author.displayName || "",   // friendlier than @handle when present
		avatar: post.author.avatar || "",       // full CDN URL, straight from the view
		t: (post.record && post.record.text) || "",
		d: (post.record && post.record.createdAt) || "",
		rkey: rk,
		// Interaction counts ride along on the view; their presence flags this as API-loaded
		// (archive posts have no counts), which the renderer keys on to show the footer row.
		rc: post.replyCount || 0,
		rp: post.repostCount || 0,
		lk: post.likeCount || 0,
	};
	if (post.record && post.record.facets) INDEX[rk].f = post.record.facets;
	Object.assign(INDEX[rk], mediaFrom(post.embed));   // images / link card / video, from the same view
	children[rk] = children[rk] || [];
	quotedBy[rk] = quotedBy[rk] || [];
	// Quotes ride along in the embed (native record-quote, X-host card) and in facets
	// (post-link facets are quotes too). All three rules applied at intake, then a single
	// pass wires the reverse index so promoted facet-link quotes don't miss it.
	const quotes = [];
	const qrk = injectQuoted(post.embed);
	if (qrk && qrk !== rk) quotes.push(qrk);
	const trk = injectTweetQuote(rk, post.embed);
	if (trk) quotes.push(trk);
	if (quotes.length) INDEX[rk].q = quotes;
	promoteFacetQuotes(rk, INDEX[rk]);
	for (const q of INDEX[rk].q || []) (quotedBy[q] || (quotedBy[q] = [])).push(rk);
	return rk;
}

// Lift the displayable media out of an embed view — pre-resolved URLs, no extra call.
// Mirrors the archive's {img, ext, vid} shape so the renderer treats both the same.
// recordWithMedia carries its media beside the quote; the quote is handled separately.
function mediaFrom(embed) {
	if (!embed) return null;
	const t = embed["$type"];
	if (t === "app.bsky.embed.recordWithMedia#view") return mediaFrom(embed.media);
	if (t === "app.bsky.embed.images#view")
		return {img: embed.images.map(im => ({u: im.fullsize, a: im.alt || "", ar: im.aspectRatio ? [im.aspectRatio.width, im.aspectRatio.height] : null}))};
	if (t === "app.bsky.embed.external#view") {
		const x = embed.external || {};
		if (isXHost(x.uri)) return null;   // X-host card → handled as a synthetic tweet quote in injectExternal
		return {ext: {u: x.uri, t: x.title || "", d: x.description || "", thumb: x.thumb || ""}};
	}
	if (t === "app.bsky.embed.video#view") {
		const v = {a: embed.alt || ""};
		if (embed.aspectRatio) v.ar = [embed.aspectRatio.width, embed.aspectRatio.height];
		return {vid: v, playlist: embed.playlist, poster: embed.thumbnail};
	}
	return null;
}

// Tweet quotes — bsky surfaces them as external link cards whose URI is on X/Twitter.
// Detected once at intake (archive load and network injection both flow through here),
// synthesized as an "x:<parentRk>" node so the graph treats them like any other quote.
const X_HOSTS = new Set(["twitter.com", "x.com", "mobile.twitter.com"]);
function isXHost(uri) {
	try {
		const h = new URL(uri).hostname.toLowerCase();
		return X_HOSTS.has(h.startsWith("www.") ? h.slice(4) : h);
	} catch { return false; }
}
const TWEET_TITLE = /^(.*?) on (?:X|Twitter):\s*"?(.*?)"?\s*$/s;
function tweetQuoteAt(parentRk, uri, title, description) {
	if (!uri || !isXHost(uri)) return null;
	const tid = "x:" + parentRk;
	if (INDEX[tid]) return tid;
	title = (title || "").trim();
	let text = (description || "").trim();
	let author = "";
	const m = title.match(TWEET_TITLE);
	if (m) { author = m[1].trim(); text = text || m[2].trim(); }
	if (!author) {
		const h = uri.match(/(?:twitter\.com|x\.com)\/([A-Za-z0-9_]+)/);
		if (h && !["i", "intent", "home"].includes(h[1].toLowerCase())) author = "@" + h[1];
	}
	text = text || title || (author ? author + " on X" : "X post");
	INDEX[tid] = {tweet: true, u: uri, t: text};
	if (author) INDEX[tid].a = author;
	return tid;
}
function injectTweetQuote(parentRk, embed) {
	const ext = embed && (
		embed["$type"] === "app.bsky.embed.external#view" ? embed.external
		: embed["$type"] === "app.bsky.embed.recordWithMedia#view" && embed.media
			&& embed.media["$type"] === "app.bsky.embed.external#view" ? embed.media.external
		: null);
	if (!ext) return null;
	const tid = tweetQuoteAt(parentRk, ext.uri, ext.title, ext.description);
	if (tid) { children[tid] = children[tid] || []; quotedBy[tid] = quotedBy[tid] || []; }
	return tid;
}

// A facet linking to a held post is a quote; an X-host facet should render as plain text
// (not a clickable link). Applied at intake on both archive and network entries so the
// rule lives in one place and the JSON wire format carries raw facets either way.
const POST_LINK = /\/post\/([0-9a-z]+)/;
function promoteFacetQuotes(rk, e) {
	if (!e.f || !e.f.length) return;
	const kept = [], qset = new Set(e.q || []);
	let touched = false;
	for (const f of e.f) {
		let promoted = false, xLink = false;
		for (const feat of f.features || []) {
			if (feat.$type !== "app.bsky.richtext.facet#link") continue;
			const uri = feat.uri || "";
			if (isXHost(uri)) xLink = true;
			const m = uri.match(POST_LINK);
			if (m && INDEX[m[1]] && m[1] !== rk) { qset.add(m[1]); promoted = true; }
		}
		if (promoted || xLink) touched = true; else kept.push(f);
	}
	if (!touched) return;
	if (kept.length) e.f = kept; else delete e.f;
	if (qset.size) e.q = [...qset];
}

// Pull a quoted post straight out of an embed view (record or record-with-media) and
// inject it as a node. Returns its rkey, or null if there's nothing quoted / it's a
// blocked/detached/not-found quote. The embedded view carries the quoted post in full.
function injectQuoted(embed) {
	if (!embed) return null;
	const rec = embed["$type"] === "app.bsky.embed.record#view" ? embed.record
		: embed["$type"] === "app.bsky.embed.recordWithMedia#view" ? embed.record && embed.record.record
		: null;
	if (!rec || rec["$type"] !== "app.bsky.embed.record#viewRecord" || !rec.uri || !rec.author) return null;
	const rk = rkeyOf(rec.uri);
	if (!INDEX[rk]) {
		INDEX[rk] = {
			did: rec.author.did,
			handle: rec.author.handle || "",
			name: rec.author.displayName || "",
			avatar: rec.author.avatar || "",
			t: (rec.value && rec.value.text) || "",
			d: (rec.value && rec.value.createdAt) || "",
			rkey: rk,
		};
		if (rec.value && rec.value.facets) INDEX[rk].f = rec.value.facets;
		Object.assign(INDEX[rk], mediaFrom((rec.embeds || [])[0]));   // the quoted post's own media
		children[rk] = children[rk] || [];
		quotedBy[rk] = quotedBy[rk] || [];
	}
	return rk;
}

// Record that childRk is a reply to parentRk (sets the parent pointer on fetched
// nodes and wires up the child list so the reply tree can walk through them).
function linkReply(parentRk, childRk) {
	if (INDEX[childRk] && !INDEX[childRk].p) INDEX[childRk].p = parentRk;   // only set an unknown parent (never relink a held post)
	const kids = children[parentRk] || (children[parentRk] = []);
	if (!kids.includes(childRk)) {
		kids.push(childRk);
		kids.sort((a, b) => (INDEX[a].d || "").localeCompare(INDEX[b].d || ""));
	}
}

// Restore the view encoded in the hash (shared link, reload, Back/Forward).
// Just hand the focus + named roots to showView, which fetches what it needs.
function showHash(initial) {
	if (!initial && location.hash === lastShown) return;   // popstate+hashchange both fire one move
	lastShown = location.hash;
	syncURL();
	const v = parseHash();
	if (v) showView(v.focus, v.roots, false, v.collapsed, v.up);
	else { const f = topThreads()[0]; if (f) navigate(f.rkey); }
}

// Focus highlight, focal-author whitening, and search rings used to be separate DOM passes
// (setFocusNode/markFocal/markSearchHits); they're now folded into nodeClass + view.refresh().
// Edge geometry (quoteCurve), the camera (fitView/panIntoView), and pointer interaction all
// moved into flexforest-view too.

// Pan / zoom / pinch / long-press and the camera all live in flexforest-view (it binds the
// svg + window pointer handlers in its constructor). The page only drives the Fit button.
$("#fit").onclick = () => view.fit();

// The URL field sets the hash, which drives everything (hashchange → showHash). A
// pasted at:// URI or bsky.app post URL becomes a focus token; a pasted link to this
// page contributes its own fragment; anything else is taken as the hash verbatim.
$("#url").addEventListener("change", () => {
	let v = $("#url").value.trim();
	if (!v) return;
	v = normalizeRef(v) || (v.includes("#") ? v.slice(v.indexOf("#") + 1) : v);
	location.hash = v;
	$("#url").blur();
});

// Manual light/dark flip. The current theme is the forced color-scheme if one is
// set, else whatever the OS prefers; clicking forces the opposite and remembers it.
$("#theme").onclick = () => {
	const cs = document.documentElement.style.colorScheme;
	const dark = cs ? cs === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
	const next = dark ? "light" : "dark";
	document.documentElement.style.colorScheme = next;
	localStorage.setItem("theme", next);
};
// type=search clears via the native ✕ (and Esc); its input event rebuilds the list.
// Debounced (~0.7s) so it runs once you pause typing, not on every keystroke.
let searchTimer;
$("#q").addEventListener("input", () => {
	clearTimeout(searchTimer);
	searchTimer = setTimeout(() => { buildSidebar(); view.refresh(); }, 700);   // refresh re-rings graph matches
});

// Hovering a sidebar row draws a box around the run of rows in the same tree.
// Results are clustered by tree, so the run is contiguous; we just span from the
// first matching row's top to the last's bottom. Only shown for 2+ rows (a lone
// match needs no box — plain :hover covers it). Delegated so it survives rebuilds;
// kinGroup guards against recomputing on every mousemove within a row.
let kinGroup = null;
const setKin = (group) => {
	if (group === kinGroup) return;
	kinGroup = group;
	// Tint every row of the hovered group (reliable, no positioning math)…
	const all = $("#sidebar").querySelectorAll("li[data-group]");
	all.forEach(li => li.classList.toggle("kin", group != null && li.dataset.group === group));
	// …and draw the enclosing box over the run when it's a real group (2+ rows).
	const box = $("#kinbox");
	if (!box) return;
	const rows = group == null ? [] : [...all].filter(li => li.dataset.group === group);
	if (rows.length < 2) { box.style.display = "none"; return; }
	let top = Infinity, bot = -Infinity;
	for (const r of rows) { top = Math.min(top, r.offsetTop); bot = Math.max(bot, r.offsetTop + r.offsetHeight); }
	box.style.top = top + "px";
	box.style.height = (bot - top) + "px";
	box.style.display = "block";
};
$("#sidebar").addEventListener("mouseover", (e) => {
	const li = e.target.closest("li[data-group]");
	setKin(li ? li.dataset.group : null);
});
$("#sidebar").addEventListener("mouseleave", () => setKin(null));
// Back/Forward (popstate) and manual hash edits (hashchange) restore the named
// view, fetching any outside threads it references. Both events fire for one
// history move; showHash's lastShown guard collapses them to a single restore.
window.addEventListener("popstate", () => showHash(false));
window.addEventListener("hashchange", () => showHash(false));
// (The view refits on its own ResizeObserver when the svg box changes — sidebar toggle,
// window resize — gated on userMoved and an in-flight animation.)
load();   // module is deferred, so the DOM is ready
</script>
</body>
</html>
